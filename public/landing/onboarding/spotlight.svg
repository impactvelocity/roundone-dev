<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#13134a" flood-opacity="0.14"/>
    </filter>
    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- dimmed neighbours -->
  <g opacity="0.45">
    <rect x="96" y="130" width="168" height="140" rx="14" fill="#ffffff"/>
    <rect x="118" y="154" width="90" height="10" rx="5" fill="#d4d4d8"/>
    <rect x="118" y="176" width="124" height="8" rx="4" fill="#e4e4e7"/>
    <rect x="118" y="192" width="104" height="8" rx="4" fill="#e4e4e7"/>
    <rect x="118" y="230" width="70" height="20" rx="10" fill="#f4f4f5"/>
  </g>
  <g opacity="0.45">
    <rect x="536" y="130" width="168" height="140" rx="14" fill="#ffffff"/>
    <rect x="558" y="154" width="90" height="10" rx="5" fill="#d4d4d8"/>
    <rect x="558" y="176" width="124" height="8" rx="4" fill="#e4e4e7"/>
    <rect x="558" y="192" width="104" height="8" rx="4" fill="#e4e4e7"/>
    <rect x="558" y="230" width="70" height="20" rx="10" fill="#f4f4f5"/>
  </g>

  <!-- the spotlit card -->
  <g filter="url(#ringGlow)">
    <rect x="296" y="112" width="208" height="176" rx="16" fill="#ffffff"/>
  </g>
  <rect x="296" y="112" width="208" height="176" rx="16" fill="none" stroke="#06b6d4" stroke-width="4"/>
  <rect x="322" y="140" width="110" height="12" rx="6" fill="#1b1b34"/>
  <rect x="322" y="166" width="156" height="9" rx="4.5" fill="#d4d4d8"/>
  <rect x="322" y="184" width="132" height="9" rx="4.5" fill="#d4d4d8"/>
  <rect x="322" y="216" width="156" height="28" rx="9" fill="#ecfeff"/>
  <rect x="334" y="226" width="84" height="8" rx="4" fill="#0e7490"/>

  <!-- agent cursor on the card -->
  <path d="M472 236 500 253l-13.2 2.8-6.7 11.9L472 236Z" fill="#06b6d4" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="490" y="266" width="84" height="28" rx="14" fill="#06b6d4"/>
  <text x="532" y="285" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">ChatGPT</text>
</svg>
