<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#13134a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- ambient work glow around the frame -->
  <rect x="18" y="18" width="764" height="364" rx="26" fill="none" stroke="#06b6d4" stroke-width="26" filter="url(#glow)" opacity="0.55"/>
  <rect x="26" y="26" width="748" height="348" rx="22" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.9"/>

  <!-- mini app window -->
  <g filter="url(#soft)">
    <rect x="250" y="96" width="300" height="196" rx="16" fill="#ffffff"/>
  </g>
  <rect x="250" y="96" width="300" height="40" rx="16" fill="#fafafa"/>
  <rect x="250" y="120" width="300" height="16" fill="#fafafa"/>
  <circle cx="274" cy="116" r="5" fill="#e4e4e7"/>
  <circle cx="290" cy="116" r="5" fill="#e4e4e7"/>
  <rect x="330" y="108" width="140" height="16" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="342" y="113" width="70" height="6" rx="3" fill="#d4d4d8"/>

  <rect x="272" y="156" width="120" height="12" rx="6" fill="#d4d4d8"/>
  <rect x="272" y="182" width="256" height="26" rx="8" fill="#ecfeff"/>
  <rect x="284" y="191" width="110" height="8" rx="4" fill="#67e8f9"/>
  <rect x="272" y="218" width="256" height="26" rx="8" fill="#f4f4f5"/>
  <rect x="284" y="227" width="90" height="8" rx="4" fill="#d4d4d8"/>
  <rect x="272" y="254" width="256" height="26" rx="8" fill="#f4f4f5"/>
  <rect x="284" y="263" width="130" height="8" rx="4" fill="#d4d4d8"/>

  <!-- working pill -->
  <g filter="url(#soft)">
    <rect x="316" y="76" width="168" height="36" rx="18" fill="#ffffff"/>
  </g>
  <circle cx="340" cy="94" r="7" fill="none" stroke="#a5f3fc" stroke-width="3"/>
  <path d="M340 87a7 7 0 0 1 7 7" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
  <rect x="356" y="90" width="108" height="8" rx="4" fill="#1b1b34"/>
</svg>
