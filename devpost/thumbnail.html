<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoundOne thumbnail</title>
<!--
  Source for devpost/thumbnail.png (3:2), the Devpost project image.
  Render from the repo root; add #light to the URL for the light version:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --allow-file-access-from-files --hide-scrollbars --force-device-scale-factor=2 \
    --window-size=1200,800 --screenshot=devpost/thumbnail.png \
    "file://$PWD/devpost/thumbnail.html"
-->
<style>
  @font-face { font-family: "Geist Pixel"; src: url("../node_modules/geist/dist/fonts/geist-pixel/GeistPixel-Square.woff2") format("woff2"); }

  :root {
    --screen-deep: #150c2e;
    --sunset: linear-gradient(180deg, #fcd34d 0%, #fb923c 38%, #f43f5e 70%, #e11d8f 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 800px; overflow: hidden; }

  /* The landing page's night band: deep purple, sunset glow rising from the bottom edge. */
  body {
    position: relative;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 70% 55% at 50% 118%, rgba(251, 122, 60, 0.42), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 110%, rgba(217, 70, 239, 0.3), transparent 72%),
      radial-gradient(ellipse 45% 50% at 50% 40%, rgba(124, 58, 237, 0.28), transparent 75%),
      var(--screen-deep);
  }

  /* Dot grid, strongest around the middle and fading to the edges. */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1.5px 1.5px, rgba(255, 255, 255, 0.16) 1.4px, transparent 0);
    background-size: 24px 24px;
    background-position: 6px 4px;
    -webkit-mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 30%, transparent 95%);
            mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 30%, transparent 95%);
  }
  /* The landing's faint pixel stars on top. */
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.45) 1.2px, transparent 1.8px),
      radial-gradient(circle at 1px 1px, rgba(251, 191, 36, 0.35) 1.2px, transparent 1.8px);
    background-size: 97px 89px, 151px 137px;
    background-position: 13px 21px, 71px 43px;
  }

  .lockup { position: relative; display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 6px; }
  .lockup img { width: 330px; height: 330px; filter: drop-shadow(0 24px 60px rgba(124, 58, 237, 0.45)); }
  h1 {
    font: 400 64px/1.08 "Geist Pixel", sans-serif;
    text-align: center;
    letter-spacing: -0.005em;
    color: #fff;
    text-shadow: 0 4px 18px rgba(24, 8, 48, 0.7);
  }
  h1 span {
    background: var(--sunset);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 2px 10px rgba(24, 8, 48, 0.85));
  }

  /* Light version: the app's graph-paper dot grid on off-white. */
  body.light {
    background:
      radial-gradient(ellipse 55% 60% at 50% 42%, rgba(124, 58, 237, 0.10), transparent 75%),
      radial-gradient(ellipse 80% 45% at 50% 115%, rgba(232, 49, 143, 0.12), transparent 75%),
      #f8f7fb;
  }
  body.light .dots { background-image: radial-gradient(circle at 1.5px 1.5px, rgba(26, 21, 48, 0.16) 1.4px, transparent 0); }
  body.light .stars { display: none; }
  body.light .lockup img { filter: drop-shadow(0 26px 50px rgba(76, 29, 149, 0.35)); }
  body.light h1 { color: #150c2e; text-shadow: none; }
  body.light h1 span {
    background: linear-gradient(95deg, #7c3aed 0%, #d946ef 45%, #fb7a3c 100%);
    -webkit-background-clip: text; background-clip: text;
    filter: none;
  }
</style>
</head>
<body>
  <div class="dots"></div>
  <div class="stars"></div>
  <div class="lockup">
    <img src="../public/landing/logo.png" alt="RoundOne">
    <h1>Hackathon Judging<br><span>Agent &amp; Management</span></h1>
  </div>
  <script>if (location.hash === "#light") document.body.classList.add("light");</script>
</body>
</html>
