<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RoundOne screen graphic</title>
<!--
  One screen graphic: a raw screenshot from ./raw in a simple browser window,
  with numbered callouts over its core features. Which shot, and its callouts,
  come from ./shots.js (frame.html?shot=<id>).
  Render every shot (from the repo root): node devpost/screens/render.mjs
  Render one:                              node devpost/screens/render.mjs winners
  Preview in a browser:                    node devpost/screens/serve.mjs, then open
                                           http://localhost:3007/devpost/screens/frame.html?shot=<id>
  The raw screenshots are 1440×900 at 2×: the signed-in pages from the Agent Hacks
  2026 demo data (the agent review from The WebMCP Challenge #1), and the public
  winners page with capture-public.mjs.
-->
<style>
  @font-face { font-family: "Geist"; src: url("../../node_modules/geist/dist/fonts/geist-sans/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Geist"; src: url("../../node_modules/geist/dist/fonts/geist-sans/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist"; src: url("../../node_modules/geist/dist/fonts/geist-sans/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Geist Mono"; src: url("../../node_modules/geist/dist/fonts/geist-mono/GeistMono-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Geist Pixel"; src: url("../../node_modules/geist/dist/fonts/geist-pixel/GeistPixel-Square.woff2") format("woff2"); }

  :root {
    --ink: #1a1530;
    --muted: #625d78;
    --line: #e6e1f0;
    --wash: #f7f5fc;
    --violet: #7c3aed;
    --magenta: #e8318f;
    --orange: #ea6a2c;
    --pass: #0f9d6b;
    /* The callout color; a callout can switch it to magenta (judges) or orange (teams). */
    --accent: var(--violet);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 1000px; overflow: hidden; }
  body {
    position: relative;
    color: var(--ink);
    font: 400 16px/1.4 "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(900px 520px at 8% -8%, rgba(124, 58, 237, 0.13), transparent 70%),
      radial-gradient(760px 520px at 104% 108%, rgba(232, 49, 143, 0.10), transparent 70%),
      radial-gradient(circle at 1px 1px, #ddd6ee 1.1px, transparent 1.3px) 0 0 / 22px 22px,
      var(--wash);
  }
  /* Previewing in a browser window: the canvas sits centered on a dark surround. */
  html.preview { width: 100%; height: 100%; background: #1d1830; }
  html.preview body { box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .6); }

  /* ── Header ── */
  header { position: absolute; left: 130px; right: 130px; top: 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  .eyebrow { font: 500 13px/1 "Geist Mono", monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--violet); margin-bottom: 13px; }
  .eyebrow b { color: var(--muted); font-weight: 500; }
  h1 { font: 400 38px/1.05 "Geist Pixel", "Geist", sans-serif; letter-spacing: -.01em; white-space: nowrap; }
  .brand { display: flex; align-items: center; gap: 10px; font: 400 21px/1 "Geist Pixel", sans-serif; padding-bottom: 3px; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; box-shadow: 0 6px 14px -6px rgba(40, 20, 90, .55); }

  /* ── Browser window ── */
  .window {
    position: absolute; left: 130px; top: 140px; width: 1240px;
    background: #fff; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(26, 21, 48, .12);
    box-shadow: 0 50px 90px -40px rgba(46, 22, 110, .45), 0 18px 36px -18px rgba(46, 22, 110, .25);
  }
  .bar { position: relative; height: 42px; display: flex; align-items: center; padding: 0 16px; background: #fbfaff; border-bottom: 1px solid #ece8f4; }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: #e3deee; }
  .url {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 8px; min-width: 440px; justify-content: center;
    height: 27px; padding: 0 16px; border-radius: 8px; background: #f1eef8;
    font: 400 13.5px/1 "Geist", sans-serif; color: #8f89a6; white-space: nowrap;
  }
  .url b { color: var(--ink); font-weight: 500; }
  .url svg { width: 12px; height: 12px; }
  .shot { display: block; width: 100%; }

  /* ── Callouts ── */
  .ring {
    position: absolute; border: 2.5px solid var(--accent); border-radius: 12px;
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 16%, transparent), 0 10px 28px -8px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .num {
    display: grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 7px;
    background: var(--accent); color: #fff; font: 400 15px/1 "Geist Pixel", sans-serif;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22);
  }
  .card {
    position: absolute; width: 292px; display: flex; gap: 12px; align-items: flex-start;
    padding: 15px 17px 16px 15px; border-radius: 14px;
    background: #1a1530; color: #fff;
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: 0 24px 48px -18px rgba(26, 21, 48, .6), 0 6px 14px -6px rgba(26, 21, 48, .35);
  }
  .card h3 { font-size: 17px; font-weight: 600; line-height: 1.2; letter-spacing: -.005em; margin: 2px 0 5px; }
  .card p { font-size: 14.5px; line-height: 1.38; color: #c8c1dc; }
  svg.links { position: absolute; inset: 0; width: 1500px; height: 1000px; pointer-events: none; overflow: visible; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
    </div>
    <div class="brand"><img src="../../public/landing/logo.webp" alt="">RoundOne</div>
  </header>

  <div class="window" id="window">
    <div class="bar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url" id="url"></div>
    </div>
    <img class="shot" id="shot" alt="">
  </div>

  <svg class="links" id="links"></svg>

<script src="shots.js"></script>
<script>
  const CAPTURE_WIDTH = 1440; // raw screenshots are taken at this CSS width, at 2×
  const id = new URLSearchParams(location.search).get("shot");
  const shot = window.SHOTS.find((s) => s.id === id) ?? window.SHOTS[0];
  const LOCK = '<svg viewBox="0 0 12 12" fill="none"><rect x="2" y="5.2" width="8" height="5.6" rx="1.4" fill="#8f89a6"/><path d="M4 5.2V3.8a2 2 0 0 1 4 0v1.4" stroke="#8f89a6" stroke-width="1.3"/></svg>';

  const step = String(window.SHOTS.indexOf(shot) + 1).padStart(2, "0");
  document.getElementById("eyebrow").innerHTML = `${step} <b>·</b> ${shot.eyebrow}`;
  document.getElementById("title").textContent = shot.title;
  const [domain, ...path] = shot.url.split("/");
  document.getElementById("url").innerHTML = `${LOCK}<span><b>${domain}</b>${path.length ? "/" + path.join("/") : ""}</span>`;

  const img = document.getElementById("shot");
  img.src = `raw/${shot.file}`;

  function layout() {
    const win = document.getElementById("window");
    const shotBox = img.getBoundingClientRect();
    const scale = shotBox.width / CAPTURE_WIDTH;
    const links = document.getElementById("links");

    shot.callouts.forEach((c, i) => {
      const color = c.color ? `var(--${c.color})` : null;
      // The ring, from screenshot coordinates to page coordinates.
      const [bx, by, bw, bh] = c.box;
      const ring = document.createElement("div");
      ring.className = "ring";
      const r = { x: shotBox.left + bx * scale, y: shotBox.top + by * scale, w: bw * scale, h: bh * scale };
      Object.assign(ring.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
      if (c.radius != null) ring.style.borderRadius = `${c.radius}px`;
      if (color) ring.style.setProperty("--accent", color);
      document.body.appendChild(ring);

      // The card, placed in page coordinates.
      const card = document.createElement("div");
      card.className = "card";
      if (color) card.style.setProperty("--accent", color);
      if (c.width) card.style.width = `${c.width}px`;
      card.innerHTML = `<span class="num">${i + 1}</span><div><h3>${c.title}</h3><p>${c.body}</p></div>`;
      Object.assign(card.style, { left: `${c.card[0]}px`, top: `${c.card[1]}px` });
      document.body.appendChild(card);

      // A connector from the card's edge to the ring's edge, unless they touch.
      const k = card.getBoundingClientRect();
      const kc = { x: k.left + k.width / 2, y: k.top + k.height / 2 };
      const rc = { x: r.x + r.w / 2, y: r.y + r.h / 2 };
      const from = edgePoint({ x: k.left, y: k.top, w: k.width, h: k.height }, rc);
      const to = c.to ? { x: r.x + c.to[0] * r.w, y: r.y + c.to[1] * r.h } : edgePoint(r, kc);
      if (Math.hypot(to.x - from.x, to.y - from.y) > 14) {
        const stroke = color ?? "var(--violet)";
        links.insertAdjacentHTML("beforeend",
          `<line x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"/>` +
          `<circle cx="${to.x}" cy="${to.y}" r="5.5" fill="${stroke}" stroke="#fff" stroke-width="2.5"/>`);
      }
    });
    document.body.dataset.ready = "1";
    fitToWindow();
  }

  // Opened in a browser to preview rather than rendered at 1500×1000: scale
  // the finished canvas to fit the window. (Callouts are placed first, unscaled.)
  function fitToWindow() {
    const k = Math.min(innerWidth / 1500, innerHeight / 1000);
    const preview = Math.abs(k - 1) >= 0.001;
    document.documentElement.classList.toggle("preview", preview);
    if (!preview) return;
    const x = (innerWidth - 1500 * k) / 2, y = (innerHeight - 1000 * k) / 2;
    Object.assign(document.body.style, { transformOrigin: "0 0", transform: `translate(${x}px, ${y}px) scale(${k})` });
  }
  addEventListener("resize", () => {
    document.body.style.transform = "";
    fitToWindow();
  });

  // Where the line from a rect's center toward `p` crosses the rect's edge.
  function edgePoint(rect, p) {
    const cx = rect.x + rect.w / 2, cy = rect.y + rect.h / 2;
    const dx = p.x - cx, dy = p.y - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    const t = Math.min(Math.abs((rect.w / 2) / dx || Infinity), Math.abs((rect.h / 2) / dy || Infinity));
    return { x: cx + dx * t, y: cy + dy * t };
  }

  Promise.all([document.fonts.ready, img.decode()]).then(layout);
</script>
</body>
</html>
