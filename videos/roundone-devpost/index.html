<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF8FF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      ></div>

      <div
        id="el-02-slow-part"
        class="scene"
        data-composition-id="02-slow-part"
        data-composition-src="compositions/frames/02-slow-part.html"
        data-start="3"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-round-one"
        class="scene"
        data-composition-id="03-round-one"
        data-composition-src="compositions/frames/03-round-one.html"
        data-start="8"
        data-duration="5"
        data-track-index="1"
      ></div>

      <div
        id="el-04-agent"
        class="scene"
        data-composition-id="04-agent"
        data-composition-src="compositions/frames/04-agent.html"
        data-start="13"
        data-duration="9.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-keep-human"
        class="scene"
        data-composition-id="05-keep-human"
        data-composition-src="compositions/frames/05-keep-human.html"
        data-start="22.5"
        data-duration="7.5"
        data-track-index="1"
      ></div>

      <div
        id="el-pixel-wipes"
        class="scene"
        data-composition-id="pixel-wipes"
        data-composition-src="compositions/pixel-wipes.html"
        data-start="0"
        data-duration="30"
        data-track-index="3"
        style="z-index: 20; pointer-events: none"
      ></div>
      <!-- music:start (written by kit/add-overlays.mjs) -->
      <hf-audio-group
        id="music"
        data-label="Music"
        data-volume="1"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;gain&quot;,&quot;id&quot;:&quot;n1&quot;,&quot;label&quot;:&quot;Level for web (about -16 LUFS)&quot;,&quot;params&quot;:{&quot;gain&quot;:-4}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;n2&quot;,&quot;label&quot;:&quot;Ceiling&quot;,&quot;params&quot;:{&quot;limit&quot;:-1,&quot;attack&quot;:5,&quot;release&quot;:50,&quot;level_out&quot;:0}}]}"
      ></hf-audio-group>
      <audio
        id="bgm"
        data-audio-group="music"
        data-timeline-role="music"
        src="assets/music/roundone-bgm.mp3"
        data-start="0"
        data-duration="30"
        data-media-start="1.8683"
        data-playback-rate="1.01192"
        data-track-index="12"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.03,&quot;v&quot;:1},{&quot;t&quot;:28.8,&quot;v&quot;:1,&quot;curve&quot;:0.3},{&quot;t&quot;:30,&quot;v&quot;:0}]}]}"
      ></audio>
      <!-- music:end -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
