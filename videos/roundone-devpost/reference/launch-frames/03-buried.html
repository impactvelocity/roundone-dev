  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <script>
    (function () {
      var DURATION = 6;
      var byId = function (id) { return document.getElementById(id); };
      var stage = byId("f03-stage");
      RK.hydrate(stage);

      const tl = gsap.timeline({ paused: true });
      const clock = RK.clock(tl, DURATION);

      // ── Scene 1 (0.0–1.5): card rises, headline A on the beats, cursor settles on "Keep going"
      tl.fromTo(byId("f03-cardwrap"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 0);
      tl.fromTo(byId("f03-ha1"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.5);
      tl.fromTo(byId("f03-ha2"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 1.0);

      var cur = RK.cursor({ x: 1560, y: 760 });
      stage.appendChild(cur);
      tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.3);
      tl.fromTo(cur, { x: 1560, y: 760 }, { x: 1246, y: 382, duration: 0.9, ease: "power3.inOut" }, 0.35);
      // then it drifts down with the list, coming to rest over Signal Garden's final slot
      tl.fromTo(cur, { x: 1246, y: 382 }, { x: 1420, y: 816, duration: 2.0, ease: "power2.inOut", immediateRender: false }, 1.5);

      // ── Scene 2 (1.5–3.5): the column scrolls up, accelerating; then settles (velocity-matched) in Scene 3
      var SCROLL_A = 576;  // power2.in over 1.5–3.5  (exit speed 864 px/s)
      var SCROLL_B = 760;  // power3.out over 3.5–4.35 lands on a row boundary (10 slots)
      var col = byId("f03-col");
      tl.fromTo(col, { y: 0 }, { y: -SCROLL_A, duration: 2, ease: "power2.in" }, 1.5);
      tl.fromTo(col, { y: -SCROLL_A }, { y: -SCROLL_B, duration: 0.85, ease: "power3.out", immediateRender: false }, 3.5);

      // Same curve as the two column tweens, as a pure function of t.
      function scrollAt(t) {
        if (t <= 1.5) return 0;
        if (t < 3.5) { var u = (t - 1.5) / 2; return SCROLL_A * u * u * u; }
        if (t < 4.35) { var v = 1 - (t - 3.5) / 0.85; return SCROLL_A + (SCROLL_B - SCROLL_A) * (1 - v * v * v * v); }
        return SCROLL_B;
      }
      // Signal Garden's on-screen top inside the mask: rides up with the list until 2.5s, then is
      // overtaken — it slows, the gray rows slide in above it, and it sinks back to the bottom slot by 3.5s.
      // (Hermite from y=232 moving up at the list's 216 px/s to y=304 at rest.)
      function sgScreenY(t) {
        if (t <= 2.5) return 304 - scrollAt(t);
        if (t >= 3.5) return 304;
        var s = t - 2.5;
        return 232 + 72 * (3 * s * s - 2 * s * s * s) - 216 * (s * s * s - 2 * s * s + s);
      }
      var sg = byId("f03-sg");
      var g312 = byId("f03-g312");
      clock.add(function (t) {
        var off = t > 2.5 ? sgScreenY(t) - (304 - scrollAt(t)) : 0;
        sg.style.transform = off ? "translateY(" + off.toFixed(2) + "px)" : "";
        // fully hidden under the cover row once it has landed
        sg.style.opacity = t >= 4.9 ? "0" : "1";
        // the row parked under Signal Garden only exists once it starts sliding out above it
        g312.style.opacity = t >= 2.5 ? "1" : "0";
      });

      // health-bar meter drains 4 → 1
      var meter = byId("f03-meter");
      RK.meter(meter, 12);
      RK.fillMeter(clock, meter, { from: 4, to: 1, start: 2.0, dur: 1.4 });

      // ── Scene 3 (3.5–6.0): headline swap on the beat, Signal Garden dims, a gray row covers it
      tl.fromTo(byId("f03-ha"), { y: 0 }, { y: -48, duration: 0.25, ease: "power2.in", immediateRender: false }, 3.25);
      tl.fromTo(byId("f03-ha"), { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power1.in", immediateRender: false }, 3.28);
      tl.fromTo(byId("f03-hb1"), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 3.5);
      tl.fromTo(byId("f03-hb2"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.0);

      tl.fromTo(byId("f03-sg-row"), { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power1.inOut", immediateRender: false }, 4.0);
      tl.fromTo(byId("f03-cover"), { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 4.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["03-buried"] = tl;
    })();
  </script>
