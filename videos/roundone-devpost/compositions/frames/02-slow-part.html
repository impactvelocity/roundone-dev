  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      var DURATION = 5;
      var byId = function (id) { return document.getElementById(id); };
      var stage = byId("f02-slow-part-stage");
      RK.hydrate(stage);

      var tl = gsap.timeline({ paused: true });
      var clock = RK.clock(tl, DURATION);

      // GSAP steps(n) holds its empty first step for 1/(n+1) of a tween, so stepped entrances start
      // slightly more than that early: their first visible frame then lands exactly on the beat.
      var POP_LEAD = 0.05; // RK.pop: steps(2) over 0.12s -> first step at 0.04s
      var ROW_LEAD = 0.05; // row opacity: steps(3) over 0.18s -> first step at 0.045s
      var DIV_LEAD = 0.05; // divider: steps(6) over 0.3s -> first step at ~0.043s
      var R6_LEAD = 0.045; // row 6 opacity: steps(2) over 0.12s -> first step at 0.04s

      // Checkbox centres in stage px: card x 1000 + 1px border + 738 inner - 28 padding - 15 half-box;
      // rows start under the 96px header on an 80px pitch.
      var CX = 1696;
      var CY = [327.5, 407.5, 487.5];

      function rise(el, t, dy, dur) {
        tl.fromTo(el, { y: dy, opacity: 0 }, { y: 0, opacity: 1, duration: dur, ease: "power3.out" }, t);
      }
      function landRow(el, t) {
        tl.fromTo(el, { y: 12 }, { y: 0, duration: 0.5, ease: "power3.out" }, t);
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "steps(3)" }, t - ROW_LEAD);
      }

      // ── Scene 1 (0.0–1.0): line 1, the #042 card with its header, rows 1–2
      rise(byId("f02-slow-part-l1"), 0.1, 30, 0.5);
      rise(byId("f02-slow-part-cardwrap"), 0.2, 40, 0.6);
      landRow(byId("f02-slow-part-r1"), 0.5);
      landRow(byId("f02-slow-part-r2"), 0.7);

      // ── Scene 2 (1.0–2.0): line 2, rows 3–5; the pile starts behind the card
      rise(byId("f02-slow-part-l2"), 1.0, 30, 0.5);
      landRow(byId("f02-slow-part-r3"), 1.1);
      landRow(byId("f02-slow-part-r4"), 1.3);
      landRow(byId("f02-slow-part-r5"), 1.5);

      // The pile: one more project on every beat from 1.0 to 3.5, each popping in behind the last.
      [1.0, 1.5, 2.0, 2.5, 3.0, 3.5].forEach(function (t, i) {
        RK.pop(tl, byId("f02-slow-part-stk" + (i + 1)), t - POP_LEAD, { from: 0.9 });
      });

      // ── Scene 3 (2.0–3.5): the lone cursor glides in and ticks one box at a time
      var cur = RK.cursor({ x: 1980, y: 800 });
      stage.appendChild(cur);
      tl.fromTo(cur, { x: 1980, y: 800 }, { x: CX, y: CY[0], duration: 0.4, ease: "power3.inOut" }, 1.9);
      tl.fromTo(cur, { x: CX, y: CY[0] }, { x: CX, y: CY[1], duration: 0.4, ease: "power3.inOut", immediateRender: false }, 2.65);
      // after the second tick it trudges on to row 3 (lands on 4.0, well before the cover)
      tl.fromTo(cur, { x: CX, y: CY[1] }, { x: CX, y: CY[2], duration: 0.6, ease: "power3.inOut", immediateRender: false }, 3.4);

      RK.click(clock, cur, stage, { t: 2.5, x: CX, y: CY[0] });
      RK.pop(tl, byId("f02-slow-part-tick1"), 2.5 - POP_LEAD);
      RK.click(clock, cur, stage, { t: 3.2, x: CX, y: CY[1] });
      RK.pop(tl, byId("f02-slow-part-tick2"), 3.2 - POP_LEAD);

      // ── Scene 4 (3.5–5.0): the divider draws in steps, "The idea" arrives locked, line 3
      tl.fromTo(byId("f02-slow-part-div"),
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.3, ease: "steps(6)" }, 3.5 - DIV_LEAD);

      var r6 = byId("f02-slow-part-r6");
      tl.fromTo(r6, { y: 12 }, { y: 0, duration: 0.5, ease: "power3.out" }, 3.5);
      // it sits at 60% while it arrives, then comes up fully on 4.0 as line 3 lands
      tl.fromTo(r6, { opacity: 0 }, { opacity: 0.6, duration: 0.12, ease: "steps(2)" }, 3.5 - R6_LEAD);
      tl.fromTo(r6, { opacity: 0.6 }, { opacity: 1, duration: 0.12, ease: "steps(2)", immediateRender: false }, 4.0 - R6_LEAD);
      RK.pop(tl, byId("f02-slow-part-lock"), 3.5 - POP_LEAD);
      RK.pop(tl, byId("f02-slow-part-wait"), 3.5 - POP_LEAD);

      rise(byId("f02-slow-part-l3"), 3.7, 30, 0.5);
      // everything has landed by 4.2; hold, readable, to 5.0

      window.__timelines = window.__timelines || {};
      window.__timelines["02-slow-part"] = tl;
    })();
  </script>
