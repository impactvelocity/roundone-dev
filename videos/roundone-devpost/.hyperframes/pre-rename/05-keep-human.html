<template>
  <style>
    @font-face{font-family:"GeistPixelSquare";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare.woff2") format("woff2");}
    @font-face{font-family:"GeistSans";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistSans-Variable.woff2") format("woff2");}
    @font-face{font-family:"GeistMono";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Variable.woff2") format("woff2");}

    /* Ids and classes carry the frame prefix "05-keep-human-". A CSS #id / .class selector cannot
       start with a digit, so they are matched with attribute selectors; where a rule overrides a
       kit class it is compounded with that class so it outranks the kit regardless of sheet order. */

    #root {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* Layers: ground (track 0) → stage (track 1) → dither canvas on top (track 2). */
    [id="05-keep-human-ground"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 0;
      background: #FAF8FF;
    }
    [id="05-keep-human-stage"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }
    [id="05-keep-human-fx"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 2;
      pointer-events: none;
    }
    [id="05-keep-human-dither"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }

    /* Headline + split + badges share one wrapper: it steps down and out as a unit at 4.8s. */
    [id="05-keep-human-content"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }

    /* Headline — Geist Pixel 92 ink, one line, centered, top y=120. */
    [id="05-keep-human-headline"] {
      position: absolute;
      left: 0;
      top: 120px;
      width: 1920px;
      margin: 0;
      z-index: 1;
      text-align: center;
      font-family: "GeistPixelSquare", "GeistSans", sans-serif;
      font-weight: 500;
      font-size: 92px;
      line-height: 1.06;
      color: #1D1433;
      white-space: nowrap;
    }

    /* The spread: one shared perspective parent so the mirrored rotateY entrance reads as a book. */
    [id="05-keep-human-spread"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 2;
      perspective: 1800px;
      perspective-origin: 960px 550px;
      transform-style: preserve-3d;
    }
    [class~="05-keep-human-card"] {
      position: absolute;
      top: 300px;
      width: 760px;
      height: 500px;
      box-sizing: border-box;
    }
    .rk-mock[id="05-keep-human-card-l"] {
      left: 160px;
      background: #FBF9FF;
    }
    .rk-mock[id="05-keep-human-card-r"] {
      left: 1000px;
      background: #FFFFFF;
      box-shadow: 0 2px 4px rgba(46, 22, 88, 0.05), 0 32px 86px -32px rgba(232, 49, 143, 0.35);
    }
    [class~="05-keep-human-hairline"] {
      position: absolute;
      left: 36px;
      right: 36px;
      top: -1px;
      height: 2px;
      border-radius: 999px;
      background: linear-gradient(95deg, #7C3AED 0%, #D946EF 45%, #FB7A3C 100%);
    }

    /* Card interiors are placed from the card's outer edge (offsets are 1px less for the border).
       Title row: 56px tall at card y+56; its text starts at card x+132. */
    [class~="05-keep-human-title-row"] {
      position: absolute;
      left: 55px;
      top: 55px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    [class~="05-keep-human-card-title"] {
      font-family: "GeistPixelSquare", "GeistSans", sans-serif;
      font-weight: 500;
      font-size: 48px;
      line-height: 1.05;
      color: #1D1433;
      white-space: nowrap;
    }
    [class~="05-keep-human-tile-dusk"] {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(95deg, #7C3AED 0%, #D946EF 45%, #FB7A3C 100%);
      color: #FFFFFF;
      flex: none;
    }

    /* Item rows: 60px tall, tops at card y+140 / +236 / +332 (frame y 440 / 536 / 632, centers 470 / 566 / 662).
       Item text aligns with the title text at card x+132 in both cards, which keeps the right card's
       inner edge clear for the badge that lands on it. */
    [class~="05-keep-human-item"] {
      position: absolute;
      height: 60px;
      display: flex;
      align-items: center;
    }
    [class~="05-keep-human-row-1"] {
      top: 139px;
    }
    [class~="05-keep-human-row-2"] {
      top: 235px;
    }
    [class~="05-keep-human-row-3"] {
      top: 331px;
    }
    [class~="05-keep-human-item--agent"] {
      left: 61px;
      gap: 26px;
    }
    [class~="05-keep-human-item--human"] {
      left: 131px;
      right: 55px;
      justify-content: space-between;
      gap: 24px;
    }
    .rk-tile[class~="05-keep-human-item-tile"] {
      width: 44px;
      height: 44px;
      border-radius: 12px;
    }
    [class~="05-keep-human-label"] {
      font-family: "GeistSans", sans-serif;
      font-weight: 600;
      font-size: 30px;
      line-height: 36px;
      color: #1D1433;
      white-space: nowrap;
    }
    [class~="05-keep-human-note"] {
      font-family: "GeistSans", sans-serif;
      font-weight: 400;
      font-size: 20px;
      line-height: 24px;
      color: #564B70;
      white-space: nowrap;
    }

    /* Badges live on the stage, never inside a tilted card. Each sits on a zero-size anchor at the
       spec'd point on its card's inner edge and is flex-centred on it (no CSS transform to fight
       the pop). Left: (920, 470) beside "The code"; right: (1000, 660) beside "The idea". */
    [id="05-keep-human-badges"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 3;
    }
    [class~="05-keep-human-anchor"] {
      position: absolute;
      width: 0;
      height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    [id="05-keep-human-anchor-l"] {
      left: 920px;
      top: 470px;
    }
    [id="05-keep-human-anchor-r"] {
      left: 1000px;
      top: 660px;
    }
    .rk-tag[id="05-keep-human-badge-l"],
    .rk-tag[id="05-keep-human-badge-r"] {
      flex: none;
      font-size: 24px;
      padding: 12px 22px;
      gap: 10px;
    }
    .rk-tag[id="05-keep-human-badge-l"] {
      box-shadow: 0 0 0 3px #FFFFFF, 0 12px 26px -10px rgba(76, 29, 149, 0.38);
    }
    .rk-tag[id="05-keep-human-badge-r"] {
      box-shadow: 0 0 0 3px #FFFFFF, 0 12px 26px -10px rgba(232, 49, 143, 0.4);
    }
    .rk-tag[id="05-keep-human-badge-l"] svg,
    .rk-tag[id="05-keep-human-badge-r"] svg {
      width: 24px;
      height: 24px;
    }

    /* Arcade button on its own entrance wrapper (the kit owns the button's transform for RK.press).
       The wrapper centres the button's margin box (5px top / 14px bottom) so the face centre is (960, 500). */
    [id="05-keep-human-btn-wrap"] {
      position: absolute;
      left: 0;
      top: 400px;
      width: 1920px;
      height: 209px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rk-arcade[id="05-keep-human-btn"] {
      flex: none;
      font-size: 44px;
      padding: 36px 56px 33px;
      gap: 18px;
    }

    /* Click ripple + cursor ride above everything on the stage. */
    [id="05-keep-human-ripples"],
    [id="05-keep-human-cursor-layer"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
    }
    [id="05-keep-human-ripples"] {
      z-index: 5;
    }
    [id="05-keep-human-cursor-layer"] {
      z-index: 6;
    }
  </style>

  <div id="root" data-composition-id="05-keep-human" data-width="1920" data-height="1080" data-duration="7.5">
    <div id="05-keep-human-ground" class="clip" data-start="0" data-duration="7.5" data-track-index="0">
      <div class="rk-dotgrid"></div>
    </div>

    <div id="05-keep-human-stage" class="clip" data-start="0" data-duration="7.5" data-track-index="1">
      <div id="05-keep-human-content">
        <div id="05-keep-human-headline">Keep human judging <span class="rk-dusk-text">human.</span></div>

        <div id="05-keep-human-spread">
          <div id="05-keep-human-card-l" class="rk-mock 05-keep-human-card">
            <div class="05-keep-human-title-row">
              <span class="rk-tile"><span data-rk-icon="spark" data-size="24"></span></span>
              <span class="05-keep-human-card-title">AI judges</span>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--agent 05-keep-human-row-1">
              <span class="rk-tile 05-keep-human-item-tile"><span data-rk-icon="code" data-size="24"></span></span>
              <div class="05-keep-human-item-text">
                <div class="05-keep-human-label">The code</div>
                <div class="05-keep-human-note">builds, tests, sponsor calls</div>
              </div>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--agent 05-keep-human-row-2">
              <span class="rk-tile 05-keep-human-item-tile"><span data-rk-icon="tag" data-size="24"></span></span>
              <div class="05-keep-human-item-text">
                <div class="05-keep-human-label">Classifying</div>
                <div class="05-keep-human-note">which projects are alike</div>
              </div>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--agent 05-keep-human-row-3">
              <span class="rk-tile 05-keep-human-item-tile"><span data-rk-icon="notebook" data-size="24"></span></span>
              <div class="05-keep-human-item-text">
                <div class="05-keep-human-label">Summaries</div>

            </div>
          </div>

          <div id="05-keep-human-card-r" class="rk-mock 05-keep-human-card">
            <span class="05-keep-human-hairline"></span>
            <div class="05-keep-human-title-row">
              <span class="05-keep-human-tile-dusk"><span data-rk-icon="users" data-size="24"></span></span>
              <span class="05-keep-human-card-title">People judge</span>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--human 05-keep-human-row-1">
              <span class="05-keep-human-label">Novelty</span>
              <span class="rk-tag rk-tag--human">Human only</span>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--human 05-keep-human-row-2">
              <span class="05-keep-human-label">Creativity</span>
              <span class="rk-tag rk-tag--human">Human only</span>
            </div>
            <div class="05-keep-human-item 05-keep-human-item--human 05-keep-human-row-3">
              <span class="05-keep-human-label">The idea</span>
              <span class="rk-tag rk-tag--human">Human only</span>
            </div>
          </div>
        </div>

        <div id="05-keep-human-badges">
          <div id="05-keep-human-anchor-l" class="05-keep-human-anchor">
            <span id="05-keep-human-badge-l" class="rk-tag rk-tag--agent"><span data-rk-icon="spark" data-size="24"></span>the slow part</span>
          </div>
          <div id="05-keep-human-anchor-r" class="05-keep-human-anchor">
            <span id="05-keep-human-badge-r" class="rk-tag rk-tag--flag"><span data-rk-icon="user" data-size="24"></span>the final call</span>
          </div>
        </div>
      </div>

      <div id="05-keep-human-btn-wrap">
        <div id="05-keep-human-btn" class="rk-arcade">How it works<span data-rk-icon="arrow-right" data-size="28"></span></div>
      </div>

      <div id="05-keep-human-ripples"></div>
      <div id="05-keep-human-cursor-layer"></div>
    </div>

    <div id="05-keep-human-fx" class="clip" data-start="0" data-duration="7.5" data-track-index="2">
      <canvas id="05-keep-human-dither" width="1920" height="1080"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      var ID = "05-keep-human";
      var DURATION = 7.5;
      var tl = gsap.timeline({ paused: true });
      var clock = RK.clock(tl, DURATION);

      // Ids start with a digit, so look elements up directly and hand GSAP elements, not selector strings.
      function byId(name) {
        return document.getElementById(ID + "-" + name);
      }
      function byClass(scope, name) {
        return scope.querySelectorAll('[class~="' + ID + "-" + name + '"]');
      }

      var stage = byId("stage");
      RK.hydrate(stage);

      // ── Scene 1 (0.0–1.2s): tiles clear 0.0–0.4, headline rises on 0.4, cards open from the wings on 0.6 ──
      RK.dither(clock, byId("dither"), {
        start: 0,
        dur: 0.4,
        mode: "reveal",
        color: "#150C2E",
        angle: "diagonal",
      });

      tl.fromTo(
        byId("headline"),
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.4,
      );

      // split-tilt-cards: mirrored rotateY entrance under one perspective parent, flat by 1.1s.
      tl.fromTo(
        byId("card-l"),
        { x: -120, rotationY: -14, scale: 0.94, opacity: 0 },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.6,
      );
      tl.fromTo(
        byId("card-r"),
        { x: 120, rotationY: 14, scale: 0.94, opacity: 0 },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.6,
      );

      // ── Scene 2 (1.2–2.3s): rows tick in — left tile sprite-pops while its text rises 10px;
      //    right label rises, its "Human only" tag pops 0.1s later ──
      var leftRows = byClass(byId("card-l"), "item");
      var LEFT_AT = [1.2, 1.45, 1.7];
      for (var i = 0; i < leftRows.length; i++) {
        RK.pop(tl, leftRows[i].querySelector(".rk-tile"), LEFT_AT[i]);
        tl.fromTo(
          byClass(leftRows[i], "item-text")[0],
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
          LEFT_AT[i],
        );
      }

      var rightRows = byClass(byId("card-r"), "item");
      var RIGHT_AT = [1.35, 1.6, 1.85];
      for (var j = 0; j < rightRows.length; j++) {
        tl.fromTo(
          byClass(rightRows[j], "label")[0],
          { y: 10, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
          RIGHT_AT[j],
        );
        RK.pop(tl, rightRows[j].querySelector(".rk-tag"), RIGHT_AT[j] + 0.1);
      }

      // ── Scene 3 (2.3–4.8s): badges spring-pop on the inner edges — left on 2.3, right on 2.6 — then a readable hold ──
      RK.pop(tl, byId("badge-l"), 2.3);
      RK.pop(tl, byId("badge-r"), 2.6);

      // ── Scene 4 (4.8–5.5s): headline, cards and badges step down and out together (sprite steps),
      //    then the arcade button rises into the center on 5.1 (entrance on its wrapper) ──
      tl.fromTo(
        byId("content"),
        { y: 0, opacity: 1 },
        { y: 50, opacity: 0, duration: 0.3, ease: "steps(4)" },
        4.8,
      );
      tl.fromTo(
        byId("btn-wrap"),
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
        5.1,
      );

      // ── Scene 5 (5.5–7.5s): the pixel cursor glides in to the button's right half, clicks on 6.5,
      //    the button presses and pops back; hold. (The film's closing tile cover is the root overlay's.) ──
      var AIM_X = 1120;
      var AIM_Y = 520;
      var cursorLayer = byId("cursor-layer");
      var cur = RK.cursor({ x: 1500, y: 940 });
      cursorLayer.appendChild(cur);
      tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.5);
      tl.fromTo(
        cur,
        { x: 1500, y: 940 },
        { x: AIM_X, y: AIM_Y, duration: 0.6, ease: "power3.inOut", immediateRender: false },
        5.5,
      );

      RK.press(clock, byId("btn"), 6.5);
      RK.click(clock, cur, byId("ripples"), { t: 6.5, x: AIM_X, y: AIM_Y, color: "#7C3AED", size: 150 });
      // Lockstep: the cursor tip rides the button face down its 12px drop, in the same two steps as RK.press.
      clock.add(function (t) {
        var d = t - 6.5;
        var k = 0;
        if (d >= 0 && d < 0.05) k = 0.5;
        else if (d >= 0.05 && d < 0.21) k = 1;
        else if (d >= 0.21 && d < 0.26) k = 0.5;
        cursorLayer.style.transform = k ? "translateY(" + 12 * k + "px)" : "";
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["05-keep-human"] = tl;
    })();
  </script>
</template>
