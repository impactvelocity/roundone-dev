        verdict: 6.9, flip: 7.3, flipMid: 7.48, pass: [7.7, 7.85, 8.0, 8.15, 8.3, 8.45], done: 8.6
      };

      // ── 3×3 pixel spinners (verdict rows): the lit cell steps clockwise every 0.125s ──
      var RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
      var spinners = [];
      function spinner(host, cell, gap) {
        var s = 3 * cell + 2 * gap;
        var r = "";
        for (var i = 0; i < RING.length; i++) {
          r += '<rect x="' + RING[i][0] * (cell + gap) + '" y="' + RING[i][1] * (cell + gap) + '" width="' + cell + '" height="' + cell + '"/>';
        }
        host.insertAdjacentHTML("afterbegin",
          '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + " " + s + '" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">' + r + "</svg>");
        spinners.push(Array.prototype.slice.call(host.firstChild.querySelectorAll("rect")));
      }
      var spinHosts = $$("spin");
      spinHosts.forEach(function (h) { spinner(h, 6, 1); });

      RK.hydrate(root);

      function visibleBetween(el, t0, t1) {
        var last = null;
        clock.add(function (t) {
          var v = at(t, t0) && !at(t, t1);
          if (v === last) return;
          last = v;
          el.style.opacity = v ? "1" : "0";
        });
      }
      // 0 = off, 1 = half step, 2 = on (a 2-step switch at T)
      function level(t, T0) { return !at(t, T0) ? 0 : !at(t, T0 + STEP) ? 1 : 2; }

      var lastK = -1;
      clock.add(function (t) {
        var k = Math.floor(t / 0.125 + EPS) % 8;
        if (k === lastK) return;
        lastK = k;
        for (var s = 0; s < spinners.length; s++) {
          for (var i = 0; i < 8; i++) {
            var d = (k - i + 8) % 8;
            spinners[s][i].setAttribute("opacity", d === 0 ? "1" : d === 1 ? "0.45" : "0.16");
          }
        }
      });

      // ── Scene 1 (0.0–1.0s): logo glides to the hub; card, stations and wires arrive dim ──
      var hub = $("hub");
      tl.fromTo(hub, { x: 0, y: 0, scale: 1 }, { x: 0, y: 220, scale: 150 / 170, duration: 0.6, ease: "power3.inOut" }, T.hubMove);
      tl.fromTo($("eyebrow"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T.eyebrow);
      tl.fromTo($("card"), { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, T.card);
      ["st-a", "st-b", "st-c"].forEach(function (id, i) {
        tl.fromTo($(id), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T.stations[i]);
      });
      tl.fromTo($("hub-label"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T.hubLabel);

      // Connectors: svg-path-draw on each mask path (measured length, dashoffset len → 0, stepped);
      // the visible dashed wire switches dim → lit in 2 steps and stays lit.
      var WIRE_DIM = "rgba(185,171,217,0.25)";
      var WIRE_MID = "rgba(240,171,252,0.6)";
      var WIRE_LIT = "#F0ABFC";
      function wire(key, fallbackLen, drawAt, drawDur, drawSteps, litAt) {
        var vis = $("w-" + key);
        var draw = $("d-" + key);
        var len = draw.getTotalLength();
        if (!(len > 0)) len = fallbackLen;
        draw.style.strokeDasharray = len + "";
        draw.style.strokeDashoffset = len + "";
        tl.fromTo(draw, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: drawDur, ease: "steps(" + drawSteps + ")" }, drawAt);
        var last = -1;
        clock.add(function (t) {
          var k = level(t, litAt);
          if (k === last) return;
          last = k;
          vis.style.stroke = k === 0 ? WIRE_DIM : k === 1 ? WIRE_MID : WIRE_LIT;
        });
      }
      // card → hub and the hub trunk draw first; the three branches follow at ~75% of the trunk's draw.
      wire("in", 295, T.wires, 0.15, 3, T.sendA);
      wire("trunk", 75, T.wires, 0.08, 2, T.sendA);
      wire("a", 345, T.wires + 0.06, 0.19, 4, T.sendA);
      wire("b", 90, T.wires + 0.06, 0.19, 2, T.sendB);
      wire("c", 355, T.wires + 0.06, 0.19, 4, T.toC);

      // ── Work packets: 12px sunset squares with a two-sprite trail, keyframed x/y, linear per segment ──
      var layer = $("packets");
      var TRAIL = [{ off: 0, size: 12, op: 1 }, { off: 18, size: 8, op: 0.55 }, { off: 32, size: 6, op: 0.3 }];
      function route(pts) {
        var segs = [];
        var L = 0;
        for (var i = 1; i < pts.length; i++) {
          var dx = pts[i][0] - pts[i - 1][0];
          var dy = pts[i][1] - pts[i - 1][1];
          var d = Math.abs(dx) + Math.abs(dy); // circuit paths are axis-aligned
          segs.push({ x0: pts[i - 1][0], y0: pts[i - 1][1], dx: dx, dy: dy, s0: L, d: d });
          L += d;
        }
        return { segs: segs, L: L };
      }
      function pointAt(r, s) {
        for (var i = 0; i < r.segs.length; i++) {
          var g = r.segs[i];
          if (s <= g.s0 + g.d || i === r.segs.length - 1) {
            var f = g.d ? Math.min(1, Math.max(0, (s - g.s0) / g.d)) : 0;
            return [g.x0 + g.dx * f, g.y0 + g.dy * f];
          }
        }
        return [0, 0];
      }
      // When a packet's leading edge first reaches the hub (x = 885 moving right, x = 1035 moving left, on y = 520).
      var HUB_L = 885;
      var HUB_R = 1035;
      var hubHits = [];
      function hubEntry(r, t0, t1) {
        for (var i = 0; i < r.segs.length; i++) {
          var g = r.segs[i];
          if (g.dy !== 0 || g.y0 !== 520 || g.dx === 0) continue;
          var edge = g.dx > 0 ? HUB_L - 6 : HUB_R + 6; // the 12px head's leading edge touches the hub
          var x1 = g.x0 + g.dx;
          if ((edge - g.x0) * (edge - x1) <= 0) {
            var s = g.s0 + Math.abs(edge - g.x0);
            return t0 + ((t1 - t0) * s) / r.L;
          }
        }
        return null;
      }
      function packet(fill, glow, pts, t0, t1) {
        var r = route(pts);
        var hit = hubEntry(r, t0, t1);
        if (hit != null) hubHits.push(hit);
        var bits = TRAIL.map(function (tr, i) {
          var el = document.createElement("div");
          el.className = "04-agent-bit";
          el.style.width = tr.size + "px";
          el.style.height = tr.size + "px";
          el.style.background = fill;
          if (i === 0) el.style.boxShadow = "0 0 12px 2px " + glow;
          layer.appendChild(el);
          return el;
        });
        var last = [];
        clock.add(function (t) {
          var live = at(t, t0) && !at(t, t1);
          var s = ((t - t0) / (t1 - t0)) * r.L;
          for (var i = 0; i < bits.length; i++) {
            var si = s - TRAIL[i].off;
            var key = "off";
            var x = 0;
            var y = 0;
            if (live && si >= 0) {
              var p = pointAt(r, si);
              var h = TRAIL[i].size / 2;
              x = Math.round(p[0] - h);
              y = Math.round(p[1] - h);
              key = x + "," + y;
            }
            if (key === last[i]) continue;
            last[i] = key;
            if (key === "off") {
              bits[i].style.opacity = "0";
              bits[i].style.transform = "translate(0px,0px)"; // one canonical parked state, whatever the seek order
            } else {
              bits[i].style.opacity = String(TRAIL[i].op);
              bits[i].style.transform = "translate(" + x + "px," + y + "px)";
            }
          }
        });
      }
      var GOLD = "#FCD34D";
      var ORANGE = "#FB923C";
      var ROSE = "#F43F5E";
      var SUNSET = "linear-gradient(180deg, #FCD34D 0%, #FB923C 38%, #F43F5E 70%, #E11D8F 100%)";
      // Opaque ends (card, hub) sit 6px inside the target so the packet tucks under its edge.
      packet(GOLD, "rgba(252,211,77,0.55)", [[584, 520], [1110, 520], [1110, 265], [1200, 265]], T.sendA, T.litA);
      packet(ORANGE, "rgba(251,146,60,0.55)", [[584, 520], [1200, 520]], T.sendB, T.litB);
      packet(GOLD, "rgba(252,211,77,0.55)", [[1200, 265], [1110, 265], [1110, 520], [1029, 520]], T.sendC, T.toC);
      packet(ORANGE, "rgba(251,146,60,0.55)", [[1200, 520], [1029, 520]], T.sendC, T.toC);
      packet(ROSE, "rgba(244,63,94,0.55)", [[1029, 520], [1110, 520], [1110, 785], [1200, 785]], T.toC, T.litC);
      packet(SUNSET, "rgba(251,146,60,0.6)", [[1200, 785], [1110, 785], [1110, 520], [584, 520]], T.verdict, T.flip);

      // The hub takes each packet in with a sprite thump: two stepped scale steps up and back (≈1.17 / 3.74 / 6.08 / 7.09s).
      var HUB_S = 150 / 170;
      hubHits.sort(function (a, b) { return a - b; });
      var lastPulse = -1;
      hubHits.forEach(function (P) {
        if (P - lastPulse < 0.25) return; // the two returning packets arrive together: one thump
        lastPulse = P;
        var p0 = P - 0.05; // the first visible step lands as the packet touches the hub
        tl.fromTo(hub, { scale: HUB_S }, { scale: HUB_S * 1.06, duration: 0.1, ease: "steps(2)", immediateRender: false }, p0);
        tl.fromTo(hub, { scale: HUB_S * 1.06 }, { scale: HUB_S, duration: 0.1, ease: "steps(2)", immediateRender: false }, p0 + 0.1);
      });

      // ── Card chips: violet outline as each piece of the submission is sent (cumulative) ──
      function outline(chip, T0) {
        var last = -1;
        clock.add(function (t) {
          var k = level(t, T0);
          if (k === last) return;
          last = k;
          chip.style.boxShadow = k === 0 ? "none" : k === 1 ? "inset 0 0 0 1px rgba(124,58,237,0.55)" : "inset 0 0 0 2px #7C3AED";
        });
      }
      outline($("chip-1"), T.sendA);
      outline($("chip-2"), T.sendB);
      outline($("chip-3"), T.sendC);

      // ── Stations: dim (0.4) → lit (1 + violet ring) in 2 steps; verb flicks to the sunset gradient ──
      var GLOW_HALF = "0 0 0 2px rgba(124,58,237,0.35), 0 20px 60px -20px rgba(124,58,237,0.3)";
      var GLOW_FULL = "0 0 0 2px rgba(124,58,237,0.7), 0 20px 60px -20px rgba(124,58,237,0.6)";
      function lightStation(key, T0) {
        var card = $("stc-" + key);
        var verb = $("verb-" + key);
        var last = -1;
        clock.add(function (t) {
          var k = level(t, T0);
          if (k === last) return;
          last = k;
          card.style.opacity = k === 0 ? "0.4" : k === 1 ? "0.7" : "1";
          card.style.boxShadow = k === 0 ? "none" : k === 1 ? GLOW_HALF : GLOW_FULL;
        });
        var lastV = null;
        clock.add(function (t) {
          var on = at(t, T0) && !(at(t, T0 + 0.06) && !at(t, T0 + 0.1)); // one arcade blink
          if (on === lastV) return;
          lastV = on;
          if (on) verb.classList.add("rk-sunset-text");
          else verb.classList.remove("rk-sunset-text");
        });
      }
      lightStation("a", T.litA);
      lightStation("b", T.litB);
      lightStation("c", T.litC);

      // ── Terminal panels: each colored segment types with RK.type; one caret per line ──
      // A caret that is off still holds its width (≈ one mono cell), so it doubles as the space between segments.
      // The caret lingers 0.3s after a line, but hands over before the next line in the panel starts typing.
      function typeLine(line, t0, nextAt) {
        var segs = Array.prototype.slice.call(line.querySelectorAll("[data-text]"));
        var total = 0;
        segs.forEach(function (seg) { total += seg.getAttribute("data-text").length; });
        var end = t0 + total / CPS;
        var hold = nextAt != null ? Math.max(0, Math.min(0.3, nextAt - end - 0.02)) : 0.3;
        var t = t0;
        segs.forEach(function (seg, i) {
          var text = seg.getAttribute("data-text");
          RK.type(clock, seg, text, { start: t, cps: CPS, caret: true, caretHold: i === segs.length - 1 ? hold : 0 });
          t += text.length / CPS;
        });
        return t;
      }

      // ── Scene 2 (1.0–3.5s): Nebius Sandboxes ──
      typeLine($("a1"), T.linesA[0], T.linesA[1]);
      RK.pop(tl, $("ok-a2"), typeLine($("a2"), T.linesA[1], T.linesA[2]) - POP_LEAD);
      RK.pop(tl, $("ok-a3"), typeLine($("a3"), T.linesA[2]) - POP_LEAD);

      // ── Scene 3 (3.5–5.8s): Tavily ──
      RK.pop(tl, $("ok-b1"), typeLine($("b1"), T.lineB1, T.lineB2) - POP_LEAD);
      $$("thumb").forEach(function (el, i) { RK.pop(tl, el, T.thumbs + 0.125 * i - POP_LEAD); });
      RK.pop(tl, $("ok-b2"), typeLine($("b2"), T.lineB2) - POP_LEAD);

      // ── Scene 4 (5.8–9.5s): NVIDIA Nemotron on Nebius Token Factory ──
      typeLine($("c1"), T.lineC1);
      var TIER_STEPS = [
        ["rgba(255,255,255,0.06)", "#B9ABD9"],
        ["rgba(124,58,237,0.14)", "#CFC3EA"],
        ["rgba(124,58,237,0.25)", "#E4DAF6"],
        ["rgba(124,58,237,0.35)", "#F7F2FF"]
      ];
      function powerUp(el, T0) {
        var last = -1;
        clock.add(function (t) {
          var k = !at(t, T0) ? 0 : Math.min(3, 1 + Math.floor((t - T0) / 0.04 + EPS));
          if (k === last) return;
          last = k;
          el.style.background = TIER_STEPS[k][0];
          el.style.color = TIER_STEPS[k][1];
        });
      }
      powerUp($("tier-1"), T.tiers[0]);
      powerUp($("tier-2"), T.tiers[1]);
      powerUp($("tier-3"), T.tiers[2]);
      tl.fromTo($("ultra-glow"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.ultraGlow);

      // The card flips to the verdict: two stepped halves of four 0.045s steps each (7.3 → 90° at 7.48, swap, −90° → 0° at 7.66).
      // GSAP's steps(4) holds its end value for the last fifth, so a 0.225s tween lands its final step exactly 0.18s in.
      var front = $("front");
      var back = $("back");
      var HALF = 0.18 * 1.25;
      tl.fromTo(front, { rotationY: 0 }, { rotationY: 90, duration: HALF, ease: "steps(4)" }, T.flip);
      tl.fromTo(back, { rotationY: -90 }, { rotationY: 0, duration: HALF, ease: "steps(4)", immediateRender: false }, T.flipMid);
      var lastFace = null;
      clock.add(function (t) {
        var showBack = at(t, T.flipMid);
        if (showBack === lastFace) return;
        lastFace = showBack;
        front.style.visibility = showBack ? "hidden" : "visible";
        back.style.visibility = showBack ? "visible" : "hidden";
      });

      // Verdict rows: spinner until each row turns Pass, then the footer tag.
      $$("row").forEach(function (row, i) {
        visibleBetween(row.querySelector('[class~="04-agent-spin"]'), 0, T.pass[i]);
        RK.pop(tl, row.querySelector('[class~="04-agent-pass"]'), T.pass[i] - POP_LEAD);
      });
      RK.pop(tl, $("done"), T.done - POP_LEAD);

      // Hold, everything lit (the root's pixel-wipe overlay covers the last 0.35s).

      window.__timelines = window.__timelines || {};
      window.__timelines["04-agent"] = tl;
    })();
  </script>
</template>
