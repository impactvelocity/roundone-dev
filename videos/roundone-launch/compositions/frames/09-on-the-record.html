          <div id="f09-el3" class="f09-eline">but no model id is set in the code.</div>
          <div id="f09-emeta"><span data-rk-icon="search" data-size="22"></span><span>Code scraper · confidence: low</span></div>

          <span id="f09-bip" class="rk-pill rk-pill--dark"><span data-rk-icon="refresh" data-size="20"></span>Back in the pool</span>

        <div id="f09-ahead" class="f09-row"><span class="f09-htitle">Audit trail</span><span class="f09-hsub">newest first</span></div>

        <div id="f09-en4" class="f09-entry"><div class="f09-etitle">Submitted</div><div class="f09-edetail">via the submission form</div><span class="f09-etime">9:03 AM</span></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      var DURATION = 6;
      var byId = function (id) { return document.getElementById(id); };
      var stage = byId("f09-stage");
      RK.hydrate(stage);

      var tl = gsap.timeline({ paused: true });
      var clock = RK.clock(tl, DURATION);

      // Scene 1 (0-2s): headline A, then the inbox card builds on the beat.
      tl.fromTo("#f09-headA", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.25);
      tl.fromTo("#f09-inbox", { y: 48, opacity: 0 }, { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.5);
      RK.pop(tl, byId("f09-mark"), 0.75);
      tl.fromTo("#f09-ptext", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.75);
      tl.fromTo("#f09-evid", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 1.0);
      tl.fromTo("#f09-el1", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.0);
      tl.fromTo("#f09-el2", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.15);
      tl.fromTo("#f09-el3", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.3);
      tl.fromTo("#f09-emeta", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 1.5);
      tl.fromTo("#f09-ibtns", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.5);

      // The pixel cursor glides in from the bottom (1.0s) and settles on "Back in the pool" by 1.9s.
      var BTN_X = 716, BTN_Y = 792; // button center in stage px: card 120/260 + 1px border + padding-box 595/531
      var cur = RK.cursor({ x: 1500, y: 980 });
      byId("f09-curlayer").appendChild(cur);
      tl.fromTo("#f09-curlayer", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 1.0);
      tl.fromTo(cur, { x: 1500, y: 980 }, { x: BTN_X, y: BTN_Y, duration: 0.9, ease: "power3.inOut" }, 1.0);

      // Scene 2 (2-3s): click, press, and the row becomes the result.
      RK.click(clock, cur, stage, { t: 2.0, x: BTN_X, y: BTN_Y, color: "#7C3AED" });
      tl.to("#f09-bip", { scale: 0.96, duration: 0.05, ease: "power2.in" }, 2.0);
      tl.to("#f09-bip", { scale: 1, duration: 0.05, ease: "power2.out" }, 2.05);
      tl.fromTo(cur, { x: BTN_X, y: BTN_Y }, { x: 820, y: 828, duration: 0.7, ease: "power3.out", immediateRender: false }, 2.1);
      tl.set("#f09-ibtns", { autoAlpha: 0 }, 2.25);
      RK.pop(tl, byId("f09-passtag"), 2.25);
      RK.states(clock, byId("f09-gcount"), [{ t: 0, text: "2 to decide" }, { t: 2.25, text: "1 to decide" }]);
      tl.fromTo("#f09-gwrap", { scale: 1.14 }, { scale: 1, duration: 0.16, ease: "steps(2)", immediateRender: false }, 2.25);

      // Scene 3 (3-6s): headline swap, the audit trail slides in and stamps newest-first.
      tl.fromTo("#f09-headA", { y: 0, autoAlpha: 1 }, { y: -30, autoAlpha: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, 3.0);
      tl.fromTo("#f09-headB", { y: 36, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 3.0);
      tl.fromTo("#f09-audit", { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 3.0);

      var STAMPS = [3.5, 3.75, 4.0, 4.25];
      var rule = byId("f09-rule");
      clock.add(function (t) {
        var k = 0;
        for (var i = 1; i < STAMPS.length; i++) if (t >= STAMPS[i]) k = i;
        rule.style.transform = "scaleY(" + k / (STAMPS.length - 1) + ")";
      });
      STAMPS.forEach(function (t, i) {
        RK.pop(tl, byId("f09-dot" + (i + 1)), t);
        tl.fromTo("#f09-en" + (i + 1), { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["09-on-the-record"] = tl;
    })();
  </script>
