  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      const DURATION = 6;
      const tl = gsap.timeline({ paused: true });
      const clock = RK.clock(tl, DURATION);
      var root = document.querySelector('[data-composition-id="07-open-stack"]');
      var q = function (sel) { return root.querySelector(sel); };
      RK.hydrate(root);

      // ── Scene 1 (0.0–1.0s): tiles clear, title band lands on the downbeat ──
      RK.dither(clock, q("#f07-dither"), { start: 0, dur: 0.4, mode: "reveal", color: "#150C2E", angle: "center" });
      tl.fromTo(q("#f07-eyebrow"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q("#f07-line-1"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(q("#f07-line-2"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.08);

      // "you own." flicks to the sunset gradient on the 0.5s beat (one arcade blink, then holds).
      var own = q("#f07-own");
      var ownOn = null;
      clock.add(function (t) {
        var on = t >= 0.5 && !(t >= 0.56 && t < 0.6);
        if (on === ownOn) return;
        ownOn = on;
        if (on) own.classList.add("rk-sunset-text");
        else own.classList.remove("rk-sunset-text");
      });

      // ── Scene 2 (1.0–3.0s): Nemotron card rises; tier rows land; power meters fill in steps ──
      tl.fromTo(q("#f07-nemo"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);

      var tiers = [
        { row: "#f07-tier-1", meter: "#f07-meter-1", land: 1.25, to: 3 },
        { row: "#f07-tier-2", meter: "#f07-meter-2", land: 1.75, to: 6 },
        { row: "#f07-tier-3", meter: "#f07-meter-3", land: 2.25, to: 10 },
      ];
      tiers.forEach(function (tier) {
        var m = q(tier.meter);
        RK.meter(m, 10, { colors: ["#FCD34D", "#E11D8F"] });
        tl.fromTo(q(tier.row), { opacity: 0, x: -28 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, tier.land);
        RK.fillMeter(clock, m, { to: tier.to, start: tier.land + 0.05, dur: 0.3 });
      });

      // IN-DEPTH maxes out at ~2.59s: the sunset glow blooms in behind it at 2.6s (single fade, no pulse).
      tl.fromTo(q("#f07-glow"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2.6);

      // Footer: refresh icon pops, line types in from 2.75s (done 3.75s).
      RK.pop(tl, q("#f07-foot-icon"), 2.75);
      RK.type(clock, q("#f07-foot-text"), "Unsure? A bigger Nemotron double-checks.", { start: 2.75, cps: 40 });

      // ── Scene 3 (3.0–5.0s): Nebius card + stepped fork diagram; Tavily card + chip pops ──
      tl.fromTo(q("#f07-nebius"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.0);

      var draw = function (sel, axis, origin, t, dur, steps) {
        var from = { transformOrigin: origin };
        var to = { duration: dur, ease: "steps(" + steps + ")" };
        from[axis] = 0;
        to[axis] = 1;
        tl.fromTo(q(sel), from, to, t);
      };
      var blink = function (sel, t) {
        tl.fromTo(q(sel), { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "steps(2)" }, t);
      };

      // image square on 3.5, then one fork per step: 3.625 / 3.75 / 3.875 (all drawn by 4.0).
      RK.pop(tl, q("#f07-img"), 3.5);
      blink("#f07-img-label", 3.5);
      draw("#f07-trunk", "scaleY", "50% 0%", 3.54, 0.06, 2);

      draw("#f07-bus-l", "scaleX", "100% 50%", 3.58, 0.03, 2);
      draw("#f07-drop-1", "scaleY", "50% 0%", 3.6, 0.02, 1);
      RK.pop(tl, q("#f07-fk-1"), 3.625);
      blink("#f07-fl-1", 3.625);

      draw("#f07-drop-2", "scaleY", "50% 0%", 3.7, 0.05, 2);
      RK.pop(tl, q("#f07-fk-2"), 3.75);
      blink("#f07-fl-2", 3.75);

      draw("#f07-bus-r", "scaleX", "0% 50%", 3.8, 0.03, 2);
      draw("#f07-drop-3", "scaleY", "50% 0%", 3.83, 0.04, 1);
      RK.pop(tl, q("#f07-fk-3"), 3.875);
      blink("#f07-fl-3", 3.875);

      tl.fromTo(q("#f07-tavily"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 4.0);
      RK.pop(tl, q("#f07-chip-1"), 4.25);
      RK.pop(tl, q("#f07-chip-2"), 4.5);
      RK.pop(tl, q("#f07-chip-3"), 4.75);

      // ── Scene 4 (5.0–6.0s): hold, still. ──

      window.__timelines = window.__timelines || {};
      window.__timelines["07-open-stack"] = tl;
    })();
  </script>
