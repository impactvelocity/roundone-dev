  <script>
    (function () {
      var DURATION = 6;
      var tl = gsap.timeline({ paused: true });
      var clock = RK.clock(tl, DURATION);
      var root = document.querySelector('[data-composition-id="06-agent-review"]');
      var $ = function (sel) { return root.querySelector(sel); };
      var $$ = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      // Frame-local beat times (120 BPM, beat = 0.5s).
      var EPS = 1e-4;
      var at = function (t, T) { return t >= T - EPS; };
      // RK.pop's steps(2) shows its first frame a third of the way into its 0.12s tween, so start it 0.05s early to show that frame on the beat.
      var POP_LEAD = 0.05;
      var SWAPS = [2.0, 4.0];
      var DONE = 5.5;
      var ROWS = [
        { arrive: 0.5, pass: 1.0 },
        { arrive: 1.1, pass: 1.5 },
        { arrive: 2.1, pass: 2.5 },
        { arrive: 2.6, pass: 3.0 },
        { arrive: 4.1, pass: 4.5 },
        { arrive: 4.6, score: 4.75 }
      ];
      var TRACE_T = [0.4, 0.6, 0.8, 0.95, 1.3, 2.3, 2.8, 4.3, 4.7, 5.0];

      // ── 3×3 pixel spinners: the lit cell steps clockwise around the ring every 0.125s ──
      var RING = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
      var spinners = [];
      function spinner(host, cell, gap) {
        var s = 3 * cell + 2 * gap;
        var r = "";
        for (var i = 0; i < RING.length; i++) {
          r += '<rect x="' + RING[i][0] * (cell + gap) + '" y="' + RING[i][1] * (cell + gap) + '" width="' + cell + '" height="' + cell + '"/>';
        }
        host.insertAdjacentHTML("afterbegin",
          '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + " " + s + '" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">' + r + "</svg>");
        var rects = Array.prototype.slice.call(host.firstChild.querySelectorAll("rect"));
        spinners.push(rects);
        return rects;
      }

      var tagA = $("#f06-st-a");
      var tagB = $("#f06-st-b");
      spinner(tagA, 4, 1); // 14px, the kit's tag-icon size
      var rowEls = ROWS.map(function (_, i) { return $("#f06-r" + (i + 1)); });
      var rowSpins = rowEls.map(function (row) {
        var host = row.querySelector(".f06-spin");
        spinner(host, 8, 2); // 28px, 8px cells
        return host;
      });

      RK.hydrate(root);

      var meterEl = $("#f06-meter");
      RK.meter(meterEl, 10);

      // Visible for t in [t0, t1), a pure function of t.
      function visibleBetween(el, t0, t1) {
        var last = null;
        clock.add(function (t) {
          var v = at(t, t0) && !at(t, t1);
          if (v === last) return;
          last = v;
          el.style.opacity = v ? "1" : "0";
        });
      }

      // Spinner phase, shared so every spinner steps together on the 16th-note grid.
      var lastK = -1;
      clock.add(function (t) {
        var k = Math.floor(t / 0.125 + EPS) % 8;
        if (k === lastK) return;
        lastK = k;
        for (var s = 0; s < spinners.length; s++) {
          for (var i = 0; i < 8; i++) {
            var d = (k - i + 8) % 8;
            spinners[s][i].setAttribute("opacity", d === 0 ? "1" : d === 1 ? "0.45" : "0.16");
          }
        }
      });

      // ── Scene 1: eyebrow and headline arrive; the card is already in place ──
      tl.fromTo($("#f06-eyebrow"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo($("#f06-headline"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.25);

      // Headline: verb and object hard-cut in place with a stepped 1 → 0.3 → 1 flicker. Only the live token
      // takes space, so the line stays flush with the eyebrow at x=120.
      var verbSlot = $("#f06-verb");
      var objSlot = $("#f06-obj");
      var verbToks = $$("#f06-verb > span");
      var objToks = $$("#f06-obj > span");
      var lastState = -1;
      var lastDim = null;
      clock.add(function (t) {
        var s = at(t, SWAPS[1]) ? 2 : at(t, SWAPS[0]) ? 1 : 0;
        if (s !== lastState) {
          lastState = s;
          for (var i = 0; i < 3; i++) {
            var v = i === s ? "block" : "none";
            verbToks[i].style.display = v;
            objToks[i].style.display = v;
          }
        }
        var dim = false;
        for (var j = 0; j < SWAPS.length; j++) {
          if (at(t, SWAPS[j] - 0.05) && !at(t, SWAPS[j] + 0.05)) dim = true;
        }
        if (dim !== lastDim) {
          lastDim = dim;
          verbSlot.style.opacity = dim ? "0.3" : "1";
          objSlot.style.opacity = dim ? "0.3" : "1";
        }
      });

      // ── Rows arrive with a spinner, then flip to Pass on their beat ──
      ROWS.forEach(function (r, i) {
        tl.fromTo(rowEls[i], { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, r.arrive);
        if (r.pass != null) {
          visibleBetween(rowSpins[i], 0, r.pass);
          RK.pop(tl, rowEls[i].querySelector(".f06-pass"), r.pass - POP_LEAD);
        } else {
          visibleBetween(rowSpins[i], 0, r.score);
        }
      });

      // Row 6: score counts 0 → 8.5 while the meter fills to 9 of 10, landing on 5.0.
      visibleBetween($("#f06-score"), ROWS[5].score, Infinity);
      RK.count(clock, $("#f06-score-num"), { from: 0, to: 8.5, start: 4.75, dur: 0.25, decimals: 1, steps: 17, ease: "linear" });
      RK.fillMeter(clock, meterEl, { from: 0, to: 9, start: 4.75, dur: 0.25 });

      // ── Trace: lines hard-set in order; block caret on the newest line until the review is done ──
      var lineEls = $$("#f06-lines .f06-ln");
      var caretEls = lineEls.map(function (ln) { return ln.querySelector(".f06-caret"); });
      var lastShown = -2;
      var lastCaret = -2;
      clock.add(function (t) {
        var a = -1;
        for (var i = 0; i < TRACE_T.length; i++) if (at(t, TRACE_T[i])) a = i;
        if (a !== lastShown) {
          lastShown = a;
          for (var j = 0; j < lineEls.length; j++) lineEls[j].style.opacity = j <= a ? "1" : "0";
        }
        var on = -1;
        if (a >= 0 && !at(t, DONE)) {
          var ph = (t - TRACE_T[a]) % 0.5;
          if (ph < 0.3) on = a;
        }
        if (on !== lastCaret) {
          lastCaret = on;
          for (var k = 0; k < caretEls.length; k++) caretEls[k].style.opacity = k === on ? "1" : "0";
        }
      });

      // ── Scene 3 payoff: status flips to done on 5.5 ──
      visibleBetween(tagA, 0, DONE);
      RK.pop(tl, tagB, DONE - POP_LEAD);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-agent-review"] = tl;
    })();
  </script>
