<template>
  <style>

    @font-face{font-family:"GeistSans";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistSans-Variable.woff2") format("woff2");}
    @font-face{font-family:"GeistMono";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Variable.woff2") format("woff2");}

    #root {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }

    /* Layers: ground (track 0) → stage (track 1) → dither canvas on top (track 2). */
    #f08-ground {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 0;
      background: #FAF8FF;
    }
    #f08-stage {
      position: absolute;
      left: 0;
      top: 0;

      height: 1080px;

    #f08-fx {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;

      pointer-events: none;

    #f08-dither {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      display: block;

    /* Headline — Geist Pixel 84 ink, centered, top y=130 (measured 1433px wide). */
    #f08-headline {
      position: absolute;
      left: 0;
      top: 130px;
      width: 1920px;
      margin: 0;
      z-index: 1;

      font-weight: 500;
      font-size: 84px;
      line-height: 1.06;
      color: #1D1433;
      white-space: nowrap;
    }

    /* The spread: one shared perspective parent so the mirrored rotateY tilts read as a book. */
    #f08-spread {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 2;
      perspective: 1800px;
      perspective-origin: 960px 570px;
      transform-style: preserve-3d;
    }
    .f08-card {
      position: absolute;
      top: 300px;
      width: 760px;
      height: 540px;
      box-sizing: border-box;
      padding: 56px;
    }
    #f08-card-l {
      left: 160px;
      background: linear-gradient(180deg, #F5F0FF 0%, #FBF9FF 55%, #FBF9FF 100%);
    }
    #f08-card-r {
      left: 1000px;
      background: #FFFFFF;
      box-shadow: 0 2px 4px rgba(46, 22, 88, 0.05), 0 32px 86px -32px rgba(232, 49, 143, 0.35);

    .f08-hairline {

    .f08-card-title {
      font-family: "GeistPixelSquare", "GeistSans", sans-serif;
      font-weight: 500;

      line-height: 1.05;

      white-space: nowrap;
    }

    .f08-list {
      display: flex;
      flex-direction: column;
      gap: 44px;
      margin-top: 44px;
    }
    .f08-item {
      display: flex;
      align-items: center;

      height: 36px;

    .f08-ico {
      display: flex;

    .f08-ico--agent {
      color: #7C3AED;

    .f08-ico--human {
      color: #E8318F;

    .f08-item-text {
      font-family: "GeistSans", sans-serif;

      color: #1D1433;
      white-space: nowrap;

    /* Badges live on the stage (never inside a tilted card). Each crosses its card's
       inner edge by 24px, centred in the card's free lower band (y 762–810), 32px apart
       at the spine; they pop from the point where they cross the edge. */
    #f08-badges {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      z-index: 3;
    }
    #f08-badge-l,
    #f08-badge-r {
      position: absolute;
      top: 762px;
      font-size: 24px;
      padding: 12px 22px;
      gap: 10px;
    }
    #f08-badge-l {
      right: 976px;
      transform-origin: calc(100% - 24px) 50%;
      box-shadow: 0 0 0 3px #FFFFFF, 0 12px 26px -10px rgba(76, 29, 149, 0.38);
    }
    #f08-badge-r {
      left: 976px;
      transform-origin: 24px 50%;
      box-shadow: 0 0 0 3px #FFFFFF, 0 12px 26px -10px rgba(232, 49, 143, 0.4);
    }
    #f08-badge-l svg,
    #f08-badge-r svg {
      width: 24px;
      height: 24px;
    }
  </style>

  <div id="root" data-composition-id="08-split" data-width="1920" data-height="1080" data-duration="4.5">
    <div id="f08-ground" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
      <div class="rk-dotgrid"></div>
    </div>

    <div id="f08-stage" class="clip" data-start="0" data-duration="4.5" data-track-index="1">
      <div id="f08-headline">Let the machine check the machine.</div>

      <div id="f08-spread">
        <div id="f08-card-l" class="rk-mock f08-card">
          <div class="f08-title-row">
            <span class="rk-tile"><span data-rk-icon="spark" data-size="24"></span></span>
            <span class="f08-card-title">The agent checks</span>
          </div>
          <div class="f08-list">
            <div class="f08-item">
              <span class="f08-ico f08-ico--agent"><span data-rk-icon="check" data-size="24"></span></span>
              <span class="f08-item-text">Does it build and pass its tests?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--agent"><span data-rk-icon="check" data-size="24"></span></span>
              <span class="f08-item-text">Does it use the sponsor tech?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--agent"><span data-rk-icon="check" data-size="24"></span></span>
              <span class="f08-item-text">Does the demo match the claims?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--agent"><span data-rk-icon="check" data-size="24"></span></span>
              <span class="f08-item-text">Did it follow the rules?</span>
            </div>
          </div>
        </div>

        <div id="f08-card-r" class="rk-mock f08-card">
          <span class="f08-hairline"></span>
          <div class="f08-title-row">
            <span class="f08-tile-dusk"><span data-rk-icon="users" data-size="24"></span></span>
            <span class="f08-card-title">Humans judge</span>
          </div>
          <div class="f08-list">
            <div class="f08-item">
              <span class="f08-ico f08-ico--human"><span data-rk-icon="arrow-right" data-size="24"></span></span>
              <span class="f08-item-text">Is the idea new?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--human"><span data-rk-icon="arrow-right" data-size="24"></span></span>
              <span class="f08-item-text">Would it matter to anyone?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--human"><span data-rk-icon="arrow-right" data-size="24"></span></span>
              <span class="f08-item-text">Is it made with taste?</span>
            </div>
            <div class="f08-item">
              <span class="f08-ico f08-ico--human"><span data-rk-icon="arrow-right" data-size="24"></span></span>
              <span class="f08-item-text">Would you use it?</span>
            </div>
          </div>
        </div>
      </div>

      <div id="f08-badges">
        <span id="f08-badge-l" class="rk-tag rk-tag--agent"><span data-rk-icon="spark" data-size="24"></span>does the homework</span>
        <span id="f08-badge-r" class="rk-tag rk-tag--flag"><span data-rk-icon="user" data-size="24"></span>makes the call</span>
      </div>
    </div>

    <div id="f08-fx" class="clip" data-start="0" data-duration="4.5" data-track-index="2">
      <canvas id="f08-dither" width="1920" height="1080"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      const DURATION = 4;
      const tl = gsap.timeline({ paused: true });
      const clock = RK.clock(tl, DURATION);

      const stage = document.getElementById("f08-stage");
      RK.hydrate(stage);

      // Scene 1 (0.0–1.0s): tiles clear, headline rises on 0.5, cards open from the wings on 0.75.
      RK.dither(clock, document.getElementById("f08-dither"), {
        start: 0,
        dur: 0.4,
        mode: "reveal",
        color: "#150C2E",
        angle: "diagonal",
      });

      tl.fromTo(
        document.getElementById("f08-headline"),
        { y: 36, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
        0.5,
      );

      // split-tilt-cards: mirrored rotateY tilts under one perspective parent, settling flat by 1.25s.
      tl.fromTo(
        document.getElementById("f08-card-l"),
        { x: -120, rotationY: -14, scale: 0.94, opacity: 0 },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.75,
      );
      tl.fromTo(
        document.getElementById("f08-card-r"),
        { x: 120, rotationY: 14, scale: 0.94, opacity: 0 },
        { x: 0, rotationY: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.75,
      );

      // Scene 2 (1.0–2.5s): items tick in on eighths — icon sprite-pops, text rises 10px.
      function tickIn(cardId, times) {
        const rows = document.querySelectorAll("#" + cardId + " .f08-item");
        for (let i = 0; i < rows.length; i++) {
          RK.pop(tl, rows[i].querySelector(".f08-ico"), times[i]);
          tl.fromTo(
            rows[i].querySelector(".f08-item-text"),
            { y: 10, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" },
            times[i],
          );
        }
      }
      tickIn("f08-card-l", [1.25, 1.5, 1.75, 2.0]);
      tickIn("f08-card-r", [1.5, 1.75, 2.0, 2.25]);

      // Scene 3 (2.5–4.0s): badges pop at the inner edges — left on 2.5, right on 3.0 — then hold.
      RK.pop(tl, document.getElementById("f08-badge-l"), 2.5);
      RK.pop(tl, document.getElementById("f08-badge-r"), 3.0);

      window.__timelines = window.__timelines || {};
      window.__timelines["08-split"] = tl;
    })();
  </script>
</template>
