  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      const DURATION = 4;
      const tl = gsap.timeline({ paused: true });
      const clock = RK.clock(tl, DURATION);

      const $ = function (id) { return document.getElementById(id); };
      const stage = $("f11-stage");
      RK.hydrate(stage);

      // Sprite-style stepped ease whose first jump lands ON the beat (t0), then n-1 more jumps.
      const stepIn = function (n) {
        return function (p) {
          return p <= 0 ? 0 : Math.min(1, Math.ceil(p * n - 1e-6) / n);
        };
      };

      // ── Scene 1 (0.0–1.0s): headline rises on 0.25; bricks rise from the card floor in steps(5) ──
      tl.fromTo($("f11-title"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.25);

      [["f11-b2", 0.5], ["f11-b1", 0.75], ["f11-b3", 1.0]].forEach(function (b) {
        const el = $(b[0]);
        tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.02, ease: stepIn(1) }, b[1]);
        // 5 jumps: t0, +1/16, +1/8, +3/16, lands on t0 + 0.25
        tl.fromTo(el, { yPercent: 100 }, { yPercent: 0, duration: 0.3125, ease: stepIn(5) }, b[1]);
      });

      // ── Scene 2 (1.0–2.0s): marks drop + pop (2nd 1.0 / 1st 1.25 / 3rd 1.25), names + pitches rise ──
      [["f11-mw2", "f11-m2", "f11-tx2", 1.0], ["f11-mw1", "f11-m1", "f11-tx1", 1.25], ["f11-mw3", "f11-m3", "f11-tx3", 1.25]].forEach(function (m) {
        tl.fromTo($(m[0]), { y: -30 }, { y: 0, duration: 0.18, ease: stepIn(3) }, m[3]);
        RK.pop(tl, $(m[1]), m[3]);
        tl.fromTo($(m[2]), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, m[3]);
      });

      // Place tags pop one eighth after their mark: 2nd on 1.25, 1st + 3rd on 1.5
      RK.pop(tl, $("f11-t2"), 1.25);
      RK.pop(tl, $("f11-t1"), 1.5);
      RK.pop(tl, $("f11-t3"), 1.5);

      // 1.5: the crown pops over 1st and the confetti bursts above the 1st-place brick
      RK.pop(tl, $("f11-crown"), 1.5, { from: 0.4 });
      const fx = $("f11-fx");
      RK.confetti(clock, fx, { x: 960, y: 520, start: 1.5, count: 38, size: 14 });
      fx.querySelectorAll(".rk-bit").forEach(function (bit) { bit.setAttribute("data-layout-ignore", ""); });

      // 1.75: prize tags pop
      RK.pop(tl, $("f11-p1"), 1.75);
      RK.pop(tl, $("f11-p2"), 1.75);
      RK.pop(tl, $("f11-p3"), 1.75);

      // ── Scene 3 (2.0–4.0s): cursor enters bottom-right, travels to Share, clicks on 3.0; Link copied on 3.25 ──
      const CLICK_X = 1701;
      const CLICK_Y = 288;
      const cur = RK.cursor({ x: 1832, y: 812 });
      cur.id = "f11-cursor";
      cur.setAttribute("data-layout-ignore", "");
      cur.setAttribute("data-layout-allow-occlusion", "");
      stage.appendChild(cur);
      tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "steps(2)" }, 2.0);
      tl.fromTo(cur, { x: 1832, y: 812 }, { x: CLICK_X, y: CLICK_Y, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 2.0);

      const share = $("f11-share");
      // hover as the pointer arrives
      tl.fromTo(share,
        { backgroundColor: "#FFFFFF", borderColor: "rgba(46,22,88,0.12)" },
        { backgroundColor: "#FAF8FF", borderColor: "rgba(124,58,237,0.5)", duration: 0.15, ease: "power2.out", immediateRender: false },
        2.75);
      // press on the click (3.0), release in two steps
      tl.fromTo(share, { scale: 1 }, { scale: 0.94, duration: 0.02, ease: stepIn(1), immediateRender: false }, 3.0);
      tl.fromTo(share, { scale: 0.94 }, { scale: 1, duration: 0.1, ease: stepIn(2), immediateRender: false }, 3.1);

      RK.click(clock, cur, stage, { t: 3.0, x: CLICK_X, y: CLICK_Y, color: "#7C3AED" });
      stage.querySelectorAll(".rk-ripple").forEach(function (r) { r.setAttribute("data-layout-ignore", ""); });

      RK.pop(tl, $("f11-copied"), 3.25);

      // 3.45–4.0: settled, readable hold while the confetti clears
      window.__timelines = window.__timelines || {};
      window.__timelines["11-winners"] = tl;
    })();
  </script>
