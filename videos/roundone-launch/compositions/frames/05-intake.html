  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      const DURATION = 6;
      const tl = gsap.timeline({ paused: true });
      const clock = RK.clock(tl, DURATION);
      const $ = (id) => document.getElementById(id);
      const stage = $("f05-stage");
      RK.hydrate(stage);

      // ── Scene 1 (0.0–1.0s): night tiles clear, title band, empty schema card ──
      RK.dither(clock, $("f05-dither"), { start: 0, dur: 0.4, mode: "reveal", color: "#150C2E", angle: "diagonal" });
      RK.type(clock, $("f05-eyebrow"), "SETUP", { start: 0.25, cps: 20 });
      tl.fromTo($("f05-schema"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.48);
      tl.fromTo($("f05-h1"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.5);
      tl.fromTo($("f05-h2"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.75);

      // ── Scene 2 (1.0–2.5s): header tags pop, schema rows land one per eighth ──
      RK.pop(tl, $("f05-tag-form"), 1.0);
      RK.pop(tl, $("f05-tag-api"), 1.0);
      ["f05-s0", "f05-s1", "f05-s2", "f05-s3", "f05-s4", "f05-s5"].forEach(function (id, i) {
        tl.fromTo($(id), { y: -12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.09, ease: "steps(2)" }, 1.0 + i * 0.25);
      });

      // ── Scene 3 (2.5–4.0s): criteria card slides in from the right, rows cascade ──
      tl.fromTo($("f05-criteria"), { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.5);
      ["f05-c0", "f05-c1", "f05-c2", "f05-c3"].forEach(function (id, i) {
        tl.fromTo($(id), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.75 + i * 0.25);
      });

      // ── Scene 4 (4.0–6.0s): connectors draw field → criterion, nodes pop at both ends ──
      function sampledLength(p) {
        const n = (p.getAttribute("d").match(/-?\d+(\.\d+)?/g) || []).map(Number);
        if (n.length < 8) return 400;
        let len = 0, px = n[0], py = n[1];
        for (let k = 1; k <= 64; k++) {
          const t = k / 64, u = 1 - t;
          const x = u * u * u * n[0] + 3 * u * u * t * n[2] + 3 * u * t * t * n[4] + t * t * t * n[6];
          const y = u * u * u * n[1] + 3 * u * u * t * n[3] + 3 * u * t * t * n[5] + t * t * t * n[7];
          len += Math.hypot(x - px, y - py);
          px = x; py = y;
        }
        return len;
      }
      function measure(p) {
        let len = 0;
        try { len = p.getTotalLength(); } catch (e) { len = 0; }
        if (!(len > 0)) len = sampledLength(p);
        return Math.ceil(len) + 2;
      }
      const WIRE_DRAW = 0.3;
      const wires = [
        { path: "f05-w1", start: 4.0, from: "f05-n1s", to: "f05-n1e" },
        { path: "f05-w2", start: 4.25, from: "f05-n23s", to: "f05-n2e" },
        { path: "f05-w3", start: 4.5, from: null, to: "f05-n3e" }, // shares the Repo node
        { path: "f05-w4", start: 4.75, from: "f05-n4s", to: "f05-n4e" },
      ];
      wires.forEach(function (w) {
        const p = $(w.path);
        const len = measure(p);
        p.setAttribute("stroke-dasharray", len + " " + (len + 40));
        tl.fromTo(p, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: WIRE_DRAW, ease: "power2.out" }, w.start);
        if (w.from) RK.pop(tl, $(w.from), w.start);
        RK.pop(tl, $(w.to), w.start + 0.25); // the stroke is ~99% drawn here — the line arrives
      });

      // side tags: Agent ×3 on 5.0, Judges on 5.25 — then hold
      RK.pop(tl, $("f05-side1"), 5.0);
      RK.pop(tl, $("f05-side2"), 5.0);
      RK.pop(tl, $("f05-side3"), 5.0);
      RK.pop(tl, $("f05-side0"), 5.25);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-intake"] = tl;
    })();
  </script>
