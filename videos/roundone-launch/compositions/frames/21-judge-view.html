<template>
  <style>
    @font-face{font-family:"GeistPixelSquare";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare.woff2") format("woff2");}
    @font-face{font-family:"GeistSans";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistSans-Variable.woff2") format("woff2");}
    @font-face{font-family:"GeistMono";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Variable.woff2") format("woff2");}

    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "GeistSans", sans-serif; color: #1D1433; }
    [id="f21-ground"] {
      position: absolute; inset: 0; background-color: #FAF8FF;
      background-image: radial-gradient(circle at 1px 1px, rgba(124,58,237,0.10) 1.4px, transparent 1.6px);
      background-size: 32px 32px;
    }
    [id="f21-stage"] { position: absolute; inset: 0; }

    /* Empty meter track drawn on each bar's cover (page px, the app's own empty-segment gray) */
    .f21-seg { position: absolute; top: 2px; height: 32px; border-radius: 5px; background: #F2F2F3; }

    /* "Next project" dock: film pill + mono hint, floating over the rubric in the slot under
       the total (page px; it covers the lock notice, the one spot above y=900 at rest that
       hides no score) */
    [id="f21-stage"] [id="f21-dock"] {
      position: absolute; left: 968px; top: 448px; width: 340px; height: 70px; box-sizing: border-box;
      display: flex; align-items: center; justify-content: space-between; padding: 0 11px 0 24px;
      border-radius: 18px;
    }
    [id="f21-dock"] .f21-hint { font: 500 20px/1 "GeistMono", monospace; letter-spacing: .02em; color: #564B70; white-space: nowrap; }
    [id="f21-dock"] .rk-pill { font-size: 20px; padding: 14px 20px 14px 24px; gap: 10px; }
    [id="f21-dock"] .rk-pill svg { display: block; }
  </style>

  <div id="root" data-composition-id="21-judge-view" data-width="1920" data-height="1080" data-duration="10.5">
    <div id="f21-ground" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>
    <div id="f21-stage" class="clip" data-start="0" data-duration="10.5" data-track-index="1"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script src="assets/tour/shots.js"></script>
  <script src="assets/tour-kit.js"></script>
  <script>
    (function () {
      var DURATION = 10;
      var MAGENTA = "#E8318F";
      var root = document.querySelector('[data-composition-id="21-judge-view"]');
      var stage = root.querySelector('[id="f21-stage"]');
      var shot = TK.shot("judge-view");

      // Window + header (built now so TK.ready can wait on the screenshot).
      var w = TK.window(stage, { url: shot.url, src: shot.src });
      var h = TK.header(stage, { eyebrow: "Judging <b>›</b> Judge view", title: "Judges score the idea.", chapter: 2 });

      // ── Score meters (page px, measured on judge-view.png) ──────────────────
      // Three bars are on the page (the 4th criterion's bar is below the capture's fold):
      // x 974–1302, 32px tall, ten segments on a 4px gap. Each bar is hidden under a
      // cover in the panel's white carrying an empty track, then a crop of the real
      // bar is revealed left→right one segment per step.
      var BAR_Y = [591, 713, 835];
      var SEGS = [[974, 29], [1007, 29], [1040, 30], [1074, 29], [1107, 29], [1140, 29], [1173, 29], [1206, 30], [1240, 29], [1273, 29]];
      var bars = BAR_Y.map(function (y) {
        var cov = TK.cover(w, [972, y - 2, 332, 36], "#FFFFFF");
        cov.innerHTML = SEGS.map(function (s) {
          return '<i class="f21-seg" style="left:' + (s[0] - 972) + "px;width:" + s[1] + 'px"></i>';
        }).join("");
        return TK.crop(w, [974, y - 1, 328, 34]);
      });
      // Each criterion's score (10 · 9 · 9) lands when its bar is full.
      var digits = [[1278, 536, 27, 22], [1286, 642, 19, 22], [1286, 764, 19, 22]].map(function (r) {
        TK.cover(w, r, "#FFFFFF");
        return TK.crop(w, r);
      });

      TK.ready(root).then(function () {
        var tl = gsap.timeline({ paused: true });
        var clock = RK.clock(tl, DURATION);

        // Callouts, renumbered: 1 Everything on one page · 2 Score what people should · 3 A running total.
        // Card 1 sits 119px left of its shots.js spot so its connector clears card 2 in the final hold.
        var list = shot.callouts.map(function (c) { return Object.assign({}, c); });
        list[0].cardAt = [380, 208];
        var co = TK.callouts(w, list, { only: [0, 2, 1] });
        // An undrawn connector (dashoffset = its length) still paints its round cap at the ring end;
        // a gap longer than the line keeps it fully hidden until it draws.
        co.forEach(function (c) {
          if (c.line) c.line.setAttribute("stroke-dasharray", c.line.__len + " " + (c.line.__len + 8));
        });

        // Ring-only highlights on the submission panel's rows (inside callout 1's box).
        var ROWS = [
          [126, 553, 760, 46],  // Video
          [126, 606, 760, 106], // Overview — the pitch
          [126, 719, 760, 46],  // Live demo
        ];
        var rings = TK.callouts(w, ROWS.map(function (b) {
          return { box: b, cardAt: [b[0], b[1]], color: "magenta", title: "", body: "" };
        }));
        rings.forEach(function (r) {
          r.card.remove();
          if (r.line) { r.line.remove(); r.dot.remove(); }
        });
        function ringOff(r, t) {
          tl.fromTo(r.ring, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "steps(3)", immediateRender: false }, t);
        }
        // Callout 1 steps aside while the camera works the rubric (its card would sit under the
        // headline band there) and comes back for the final wide hold.
        function calloutBack(c, t) {
          var els = [c.ring, c.card].concat(c.line ? [c.line, c.dot] : []);
          tl.fromTo(els, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
        }

        // The "Next project" dock and the page cursor (above everything in the page layer).
        var dock = document.createElement("div");
        dock.id = "f21-dock";
        dock.className = "rk-mock";
        dock.innerHTML = '<span class="f21-hint">4 of 6</span>' +
          '<span class="rk-pill rk-pill--dark">Next project' + RK.icon("arrow-right", 20) + "</span>";
        w.layer.appendChild(dock);
        var pill = dock.querySelector(".rk-pill");
        var CLICK = { x: 1180, y: 485 };
        var FROM = { x: 1400, y: 590 };
        var cur = RK.cursor(FROM);
        w.layer.appendChild(cur);

        // Scene 1 (0.0–1.0): header, then the window rises.
        TK.showHeader(tl, h, 0.05);
        TK.showWindow(tl, w, 0.2);

        // Scene 2 (1.0–3.75): push onto the submission panel; callout 1; the highlight steps
        // over the video, the pitch and the live demo.
        TK.focus(tl, w, 0.9, { x: 106, y: 208, w: 800, h: 570 }, { max: 1.4 });
        TK.showCallout(tl, co[0], 1.5);
        TK.showCallout(tl, rings[0], 2.25, { ringOnly: true });
        TK.showCallout(tl, rings[1], 2.75, { ringOnly: true });
        ringOff(rings[0], 2.75);
        TK.showCallout(tl, rings[2], 3.25, { ringOnly: true });
        ringOff(rings[1], 3.25);
        ringOff(rings[2], 3.75);

        // Scene 3 (3.75–6.5): across to the rubric; callout 2; the meters fill segment by segment.
        TK.focus(tl, w, 3.75, co[1].rect, { max: 1.5 });
        TK.dimCallout(tl, co[0], 3.75, 0);
        TK.showCallout(tl, co[1], 4.25);
        [4.75, 5.1, 5.45].forEach(function (t, i) {
          tl.fromTo(bars[i], { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "steps(10)" }, t);
          RK.pop(tl, digits[i], t + 0.35); // 5.1 · 5.45 · 5.8
        });

        // Scene 4 (6.5–8.0): a small push toward the total (card 3 down to the first filled
        // meter, so the total reads against the scores); callout 3.
        TK.focus(tl, w, 6.25, { x: 964, y: 208, w: 350, h: 415 }, { max: 1.6, dur: 0.85, anchor: [0.6, 0.5] });
        TK.showCallout(tl, co[2], 6.5);

        // Scene 5 (8.0–10.0): back to rest with callout 1 in view again; the pill pops; the
        // cursor clicks it. Hold.
        TK.rest(tl, w, 7.75, { dur: 0.6 });
        calloutBack(co[0], 7.75);
        RK.pop(tl, dock, 8.25);
        tl.fromTo(cur, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "steps(2)" }, 8.3);
        tl.fromTo(cur, { x: FROM.x, y: FROM.y }, { x: CLICK.x, y: CLICK.y, duration: 0.62, ease: "power3.inOut" }, 8.32);
        RK.click(clock, cur, w.layer, { t: 9.0, x: CLICK.x, y: CLICK.y, color: MAGENTA });
        tl.fromTo(pill, { scale: 1 }, { scale: 0.94, duration: 0.06, ease: "steps(1)", transformOrigin: "50% 50%" }, 8.97);
        tl.fromTo(pill, { scale: 0.94 }, { scale: 1, duration: 0.08, ease: "steps(2)", immediateRender: false }, 9.13);

        window.__timelines = window.__timelines || {};
        window.__timelines["21-judge-view"] = tl;
      });
    })();
  </script>
</template>
