  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script>
    (function () {
      var DURATION = 6;
      var tl = gsap.timeline({ paused: true });
      var clock = RK.clock(tl, DURATION);

      function byId(id) {
        return document.getElementById(id);
      }

      var stage = byId("f10-stage");
      RK.hydrate(stage);

      // ── Scene 1 (0.0–2.5s) ─────────────────────────────────────────────
      // Headline A rises in on the 0.25s pickup; the funnel card is present from 0.25s.
      tl.fromTo(byId("f10-headA"), { y: 32, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.25);
      tl.fromTo(byId("f10-card"), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.25);

      // The app's pixel funnel (Judging › Progress), bottom of the card.
      var CELL = 16;
      var FW = 1060;
      var FH = 320;
      var svg = byId("f10-funnel-svg");
      var bandGroups = RK.funnel(svg, {
        width: FW,
        height: FH,
        cell: CELL,
        bands: [
          { color: "#7c3aed", count: 186 },
          { color: "#c026d3", count: 142 },
          { color: "#f43f5e", count: 40, live: true },
          { color: "#fb923c", count: 12, faded: true },
        ],
      });

      // Stage columns land on beats 0.5 / 1.0 / 1.5 / 2.0: text rises in, count steps up,
      // and the funnel sweeps left→right to that stage's edge in the same 8 steps.
      var BEATS = [0.5, 1.0, 1.5, 2.0];
      var COUNTS = [186, 142, 40, 12];
      var SWEEP = 0.35;
      var STEPS = 8;
      // Whole funnel cells per stage band (a cell belongs to the column its center falls in).
      var BAND_END_CELLS = [17, 33, 50, 67];

      for (var i = 0; i < 4; i++) {
        tl.fromTo(
          byId("f10-col" + (i + 1)),
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          BEATS[i],
        );
        RK.count(clock, byId("f10-count" + (i + 1)), { from: 0, to: COUNTS[i], start: BEATS[i], dur: SWEEP, steps: STEPS });
      }

      // Same curve + quantization as RK.count's default, so the pixel front and the score move together.
      function sweepEase(p) {
        return 1 - Math.pow(1 - p, 3);
      }
      clock.add(function (t) {
        var cells = 0;
        for (var k = 0; k < BEATS.length; k++) {
          if (t < BEATS[k]) break;
          var p = Math.min(1, (t - BEATS[k]) / SWEEP);
          p = Math.round(sweepEase(p) * STEPS) / STEPS;
          var from = k === 0 ? 0 : BAND_END_CELLS[k - 1];
          cells = from + Math.round(p * (BAND_END_CELLS[k] - from));
        }
        var px = Math.min(FW, cells * CELL);
        svg.style.clipPath = "inset(0 " + ((1 - px / FW) * 100).toFixed(4) + "% 0 0)";
      });

      // Round 1 is live: the badge pops in on 1.5s and its violet dot steps on/off every beat.
      RK.pop(tl, byId("f10-live"), 1.5);
      var liveDot = byId("f10-live-dot");
      clock.add(function (t) {
        var tt = Math.min(t, DURATION - 0.01);
        var on = tt < 1.5 || Math.floor((tt - 1.5) / 0.5) % 2 === 0;
        liveDot.style.opacity = on ? "1" : "0.25";
      });

      // As in the app, a few core pixels of the live band twinkle — stepped on eighths.
      var MID = Math.round(FH / 2 / CELL) * CELL;
      var twinkles = [];
      var liveRects = bandGroups[2] ? bandGroups[2].querySelectorAll("rect") : [];
      for (var j = 0; j < liveRects.length; j++) {
        var rect = liveRects[j];
        var base = parseFloat(rect.getAttribute("opacity"));
        if (!(base >= 0.6)) continue;
        var xi = Math.round(parseFloat(rect.getAttribute("x")) / CELL);
        var ry = parseFloat(rect.getAttribute("y"));
        var yi = ry < MID ? 2 * ((MID - ry) / CELL - 1) : 2 * ((ry - MID) / CELL) + 1;
        if (RK.noise(xi, yi, 97) >= 0.25) continue;
        // Phase by pick order (left → right) so the dimmed cells spread evenly across the beat.
        twinkles.push({ el: rect, base: base, dim: Math.round(base * 30) / 100, ph: twinkles.length % 4 });
      }
      clock.add(function (t) {
        var tt = Math.min(t, DURATION - 0.01);
        var slot = tt < 2 ? -1 : Math.floor((tt - 2) / 0.25);
        for (var m = 0; m < twinkles.length; m++) {
          var c = twinkles[m];
          var isDim = slot >= 0 && (slot + c.ph) % 4 === 0;
          c.el.setAttribute("opacity", String(isDim ? c.dim : c.base));
        }
      });

      // ── Scene 2 (2.5–6.0s) ─────────────────────────────────────────────
      // Emails fly out of the funnel: each starts small (scale 0.6) on the Round 1 column's
      // pixel river and travels right into its slot on the beat (2.5 / 3.0 / 3.5).
      var LAUNCH_X = 782;
      var LAUNCH_Y = 710;
      var SLOT_CX = 1520;
      var MAILS = [
        { id: "f10-mail1", t: 2.5, cy: 335 },
        { id: "f10-mail2", t: 3.0, cy: 515 },
        { id: "f10-mail3", t: 3.5, cy: 695 },
      ];
      for (var n = 0; n < MAILS.length; n++) {
        var mail = MAILS[n];
        var el = byId(mail.id);
        tl.fromTo(
          el,
          { x: LAUNCH_X - SLOT_CX, y: LAUNCH_Y - mail.cy, scale: 0.6 },
          { x: 0, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          mail.t,
        );
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, mail.t);
        // A stepped pixel ping where each email leaves the river.
        RK.click(clock, null, stage, { t: mail.t, x: LAUNCH_X, y: LAUNCH_Y, color: "#F43F5E", size: 76 });
      }

      // On 3.0s headline A lifts out and B rises in from below — one velocity-matched roll
      // through the title mask (a within-frame seam, not an exit).
      tl.fromTo(byId("f10-headstrip"), { y: 0 }, { y: -129, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.0);
      tl.fromTo(byId("f10-headA"), { opacity: 1 }, { opacity: 0.2, duration: 0.25, ease: "none", immediateRender: false }, 3.0);
      tl.fromTo(byId("f10-headB"), { opacity: 0.4 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 3.0);

      // Hold from 4.0s: settled and readable; only the live dot and live pixels keep stepping.

      window.__timelines = window.__timelines || {};
      window.__timelines["10-rounds-emails"] = tl;
    })();
  </script>
