<template>
  <style>
    @font-face{font-family:"GeistPixelSquare";font-weight:500;font-style:normal;font-display:block;src:url("assets/fonts/GeistPixelSquare.woff2") format("woff2");}
    @font-face{font-family:"GeistSans";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistSans-Variable.woff2") format("woff2");}
    @font-face{font-family:"GeistMono";font-weight:100 900;font-style:normal;font-display:block;src:url("assets/fonts/GeistMono-Variable.woff2") format("woff2");}

    #root { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: "GeistSans", sans-serif; color: #1D1433; }
    [id="f14-ground"] {
      position: absolute; inset: 0; background-color: #FAF8FF;
      background-image: radial-gradient(circle at 1px 1px, rgba(124,58,237,0.10) 1.4px, transparent 1.6px);
      background-size: 32px 32px;
    }
    [id="f14-stage"] { position: absolute; inset: 0; }

    /* The block-type palette: the app's "Add a block" menu, in page px */
    [id="f14-palette"] {
      position: absolute; left: 470px; top: 150px; width: 300px; padding: 10px;
      background: #fff; border: 1px solid #E6E1F0; border-radius: 14px;
      box-shadow: 0 28px 60px -24px rgba(46,22,110,.45), 0 8px 18px -10px rgba(46,22,110,.25);
      font: 500 16px/1 "GeistSans", sans-serif; color: #1A1530;
    }
    [id="f14-palette"] .f14-label { padding: 8px 10px 10px; font: 500 12px/1 "GeistMono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #8A80A3; }
    .f14-type { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 9px; }
    .f14-type .f14-ic { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: #EDE5FF; color: #7C3AED; }
    .f14-type--hit { background: #F3EEFF; box-shadow: inset 0 0 0 1.5px #7C3AED; }
    [id="f14-flyer"] {
      position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
      border-radius: 999px; background: #7C3AED; color: #fff; font: 600 13px/1 "GeistSans", sans-serif;
      box-shadow: 0 10px 22px -8px rgba(124,58,237,.8);
    }
  </style>

  <div id="root" data-composition-id="14-schema" data-width="1920" data-height="1080" data-duration="8.5">
    <div id="f14-ground" class="clip" data-start="0" data-duration="8.5" data-track-index="0"></div>
    <div id="f14-stage" class="clip" data-start="0" data-duration="8.5" data-track-index="1"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="assets/retro-kit.js"></script>
  <script src="assets/tour/shots.js"></script>
  <script src="assets/tour-kit.js"></script>
  <script>
    (function () {
      var DURATION = 8;
      var root = document.querySelector('[data-composition-id="14-schema"]');
      var stage = root.querySelector('[id="f14-stage"]');
      var shot = TK.shot("schema");

      // Window + header (built now so TK.ready can wait on the screenshot).
      var w = TK.window(stage, { url: shot.url, src: shot.src });
      var h = TK.header(stage, { eyebrow: "Setup <b>›</b> Schema", title: "Shape every submission.", chapter: 0 });

      // The block-type palette, in page px inside the window's callout layer.
      var TYPES = [
        ["Text", "text"], ["Long text", "paragraph"], ["Number", "hash"], ["URL", "link"], ["Video", "play"],
        ["Repo", "branch"], ["File", "notebook"], ["Select", "check"], ["Image", "image"], ["Team", "users"],
      ];
      var palette = document.createElement("div");
      palette.id = "f14-palette";
      palette.innerHTML = '<div class="f14-label">Add a block</div>' +
        TYPES.map(function (t) {
          return '<div class="f14-type"><span class="f14-ic">' + RK.icon(t[1], 16) + "</span><span>" + t[0] + "</span></div>";
        }).join("");
      w.layer.appendChild(palette);
      var rows = palette.querySelectorAll(".f14-type");
      var repoRow = rows[5];

      // The "Repo" chip that flies from the palette onto the GitHub row's type tag.
      var flyer = document.createElement("div");
      flyer.id = "f14-flyer";
      flyer.innerHTML = RK.icon("branch", 12) + "<span>Repo</span>";
      w.layer.appendChild(flyer);

      TK.ready(root).then(function () {
        var tl = gsap.timeline({ paused: true });
        var clock = RK.clock(tl, DURATION);
        var co = TK.callouts(w, shot.callouts); // 1 Shown to entrants · 2 Typed blocks · 3 Guides the agent too

        // Scene 1 (0.0–1.0): header, then the window rises.
        TK.showHeader(tl, h, 0.05);
        TK.showWindow(tl, w, 0.2);

        // Scene 2 (1.0–3.5): push in on the block list; the palette pops open, types step in on eighths.
        TK.focus(tl, w, 0.9, { x: 90, y: 150, w: 900, h: 700 }, { max: 1.35 });
        tl.fromTo(palette, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.25);
        rows.forEach(function (r, i) {
          tl.fromTo(r, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.14, ease: "steps(3)" }, 1.4 + i * 0.125);
        });
        // 2.75: Repo lights up, then its chip flies to the GitHub row's type tag (right end of that row).
        tl.fromTo(repoRow, { backgroundColor: "rgba(243,238,255,0)" }, { backgroundColor: "rgba(243,238,255,1)", duration: 0.12, ease: "steps(2)" }, 2.75);
        var from = { x: 520, y: 397 };
        var to = { x: 918, y: 742 };
        tl.fromTo(flyer, { x: from.x, y: from.y, opacity: 0, scale: 0.8 }, { x: from.x, y: from.y, opacity: 1, scale: 1, duration: 0.12, ease: "steps(2)" }, 3.0);
        tl.fromTo(flyer, { x: from.x, y: from.y }, { x: to.x, y: to.y, duration: 0.55, ease: "power3.inOut", immediateRender: false }, 3.1);
        tl.fromTo(flyer, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "steps(2)", immediateRender: false }, 3.65);
        tl.fromTo(palette, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 3.6);
        // 3.5: callout 2 — typed blocks — on the GitHub row.
        TK.showCallout(tl, co[1], 3.5);

        // Scene 3 (4.5–6.5): over to the block drawer: what entrants see, then what guides the agent.
        TK.focus(tl, w, 4.4, { x: 560, y: 180, w: 880, h: 560 }, { max: 1.4 });
        TK.showCallout(tl, co[0], 5.0);
        TK.showCallout(tl, co[2], 5.75);

        // Scene 4 (6.5–8.0): pull back until all three callouts sit in view above y=900. Hold.
        TK.overview(tl, w, 6.5, { dur: 0.9 });

        window.__timelines["14-schema"] = tl;
      });
    })();
  </script>
</template>
