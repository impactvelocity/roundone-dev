<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF8FF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="66"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"

        data-duration="4.6"
        data-track-index="0"
      ></div>

      <div

      <div

      <!-- music:start (written by kit/add-overlays.mjs) -->
      <hf-audio-group
        id="music"
        data-label="Music"
        data-volume="1"
        data-fx-chain="{&quot;version&quot;:1,&quot;nodes&quot;:[{&quot;type&quot;:&quot;gain&quot;,&quot;id&quot;:&quot;n1&quot;,&quot;label&quot;:&quot;Level for web (about -16 LUFS)&quot;,&quot;params&quot;:{&quot;gain&quot;:-4}},{&quot;type&quot;:&quot;limiter&quot;,&quot;id&quot;:&quot;n2&quot;,&quot;label&quot;:&quot;Ceiling&quot;,&quot;params&quot;:{&quot;limit&quot;:-1,&quot;attack&quot;:5,&quot;release&quot;:50,&quot;level_out&quot;:0}}]}"
      ></hf-audio-group>
      <audio
        id="bgm-intro"
        data-audio-group="music"
        data-timeline-role="music"
        src="assets/music/roundone-bgm.mp3"
        data-start="0.154"
        data-duration="7.896"
        data-media-start="0"
        data-playback-rate="1.01192"
        data-track-index="11"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.03,&quot;v&quot;:1},{&quot;t&quot;:7.796,&quot;v&quot;:1},{&quot;t&quot;:7.896,&quot;v&quot;:0}]}]}"
      ></audio>
      <audio
        id="bgm"
        data-audio-group="music"
        data-timeline-role="music"
        src="assets/music/roundone-bgm.mp3"
        data-start="7.95"
        data-duration="58.05"
        data-media-start="1.8177"
        data-playback-rate="1.01192"
        data-track-index="12"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.1,&quot;v&quot;:1},{&quot;t&quot;:55.55,&quot;v&quot;:1,&quot;curve&quot;:0.3},{&quot;t&quot;:58.05,&quot;v&quot;:0}]}]}"
      ></audio>
      <!-- music:end -->

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { y: -1080, duration: 0.6, ease: "power3.inOut" }, 4);
        tl.fromTo("#el-02-flood", { y: 1080, opacity: 1 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.inOut" }, 4);
        tl.to("#el-02-flood", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.fromTo("#el-03-buried", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 10);
        tl.to("#el-05-intake", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 28);
        tl.fromTo("#el-06-agent-review", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 28);
        tl.to("#el-08-split", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 44);
        tl.fromTo("#el-09-on-the-record", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 44);
        tl.to("#el-09-on-the-record", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 50);
        tl.fromTo("#el-10-rounds-emails", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 50);
        tl.to("#el-10-rounds-emails", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 56);
        tl.fromTo("#el-11-winners", { x: 1920, opacity: 1 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 56);
        tl.to({}, { duration: 66 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
